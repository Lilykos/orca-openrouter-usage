}

function readoutHtml(rep) {
  const f = focusRange();
  if (f) {
    const a = aggregate(rep, f);
    const pending = TOK() && a.todayOnly;
    const n = Object.keys(a.byModel).length;
    const meta = pending ? 'Today · token counts arrive after the UTC day ends' : rangeLabel(f) + (a.partial ? ' · so far' : ` · ${n} model${n === 1 ? '' : 's'}`);
    return `<div class="readout" aria-live="polite"><span class="v">${pending ? '—' : esc(fmtV(a.total))}</span><span class="m">${esc(meta)}</span>${state.pin ? `<button type="button" class="pin" data-act="unpin" data-fk="unpin" aria-label="Clear the selected day">${esc(f.from === f.to ? dShort(f.from) : 'Week')} ✕</button>` : ''}</div>`;
  }
  const done = rep.daily.filter((d) => !d.partial);
  const total = done.reduce((s, d) => s + d.total, 0);
  let label = TOK() ? 'tokens · ' : '';
  label += rep.range === 'all' ? (done.length ? 'since ' + dShort(done[0].date) : 'all time') : 'last ' + RANGE_DAYS[rep.range] + ' days';
  const c = rep.comparison;
  if (c && !TOK()) {
    const r = c.previous > 0 ? c.current / c.previous : null;
    if (c.changePercent == null) label += ' · new spend';
    else if (r != null && r >= 1.5) label += ` · ${r.toFixed(1)}× the previous ${c.days}`;
    else if (Math.round(c.changePercent) === 0) label += ' · same as the previous ' + c.days;
    else label += ` · ${c.changePercent > 0 ? '↑' : '↓'} ${Math.abs(Math.round(c.changePercent))}% vs previous ${c.days}`;
  } else if (!TOK() && rep.range !== 'all') label += ' · comparison after more history';
  return `<div class="readout"><span class="v">${esc(fmtV(total))}</span><span class="m">${esc(label)}</span></div>`;
}

function modelsHtml(rep) {
  const f = focusRange();
  const head = (side) => `<div class="sec-h"><h2 id="h-models">Models <span class="scope">· ${esc(scopeLabel(rep))}</span></h2><span class="side">${side}</span></div>`;
  if (f) {
    const a = aggregate(rep, f);
    if (a.todayOnly) return head('') + `<p class="note-row">OpenRouter reports a UTC day's per-model split after the day ends. Today's ${esc(money(rep.tiles.today))} so far comes from your key totals.</p>`;
    const ranked = Object.entries(a.byModel).filter(([, v]) => v > 0).sort((x, y) => y[1] - x[1]);
    const total = ranked.reduce((s, [, v]) => s + v, 0);
    const rows = ranked.map(([id, v]) => {
      const [vd, nm] = splitName(id);
      return `<li><div class="mrow" title="${esc(id)}"><span class="n"><span class="vd">${esc(vd)}</span>${esc(nm)}</span><span class="val">${esc(fmtV(v))}</span><span class="pct">${pct(total ? v / total : 0)}</span><span class="bar" aria-hidden="true"><i style="width:${Math.max(1, total ? (v / total) * 100 : 0).toFixed(1)}%"></i></span></div></li>`;
    }).join('');
    return head(`${ranked.length} used`) + `<ul class="mlist">${rows || '<li class="note-row">No usage on this day.</li>'}</ul>`;
  }
  const list = rep.models.slice().sort((x, y) => modelVal(y) - modelVal(x));
  const total = list.reduce((s, m) => s + modelVal(m), 0);
  const top = list.length === TOP_MODELS + 1 ? TOP_MODELS + 1 : TOP_MODELS;
  const shown = state.modelsAll ? list : list.slice(0, top);
  const rest = list.slice(top);
  const rows = shown.map((m) => {
    const [vd, nm] = splitName(m.name);
    const v = modelVal(m);
    const open = state.model === m.name;
    return `<li><button type="button" class="mrow" aria-expanded="${open}" data-act="model" data-val="${esc(m.name)}" data-fk="model:${esc(m.name)}" title="${esc(m.name)}">
      <span class="n"><span class="vd">${esc(vd)}</span>${esc(nm)}</span><span class="val">${esc(fmtV(v))}</span><span class="pct">${pct(total ? v / total : 0)}</span>
      <span class="bar" aria-hidden="true"><i style="width:${Math.max(1, total ? (v / total) * 100 : 0).toFixed(1)}%"></i></span></button>${open ? modelDetailHtml(rep, m) : ''}</li>`;
  }).join('');
  let more = '';
  if (rest.length && !state.modelsAll) {
    const rv = rest.reduce((s, m) => s + modelVal(m), 0);
    more = `<li><button type="button" class="mrow more" data-act="models-more" data-fk="models-more" aria-expanded="false"><span class="n">${rest.length} more model${rest.length === 1 ? '' : 's'}</span><span class="val">${esc(fmtV(rv))}</span><span class="pct">${pct(total ? rv / total : 0)}</span></button></li>`;
  } else if (state.modelsAll && list.length > top) {
    more = `<li><button type="button" class="mrow more" data-act="models-more" data-fk="models-more" aria-expanded="true"><span class="n">Show the top ${top} only</span><span></span><span></span></button></li>`;
  }
  return head(`${list.length} used`) + `<ul class="mlist">${rows || '<li class="note-row">No models in this range.</li>'}${more}</ul>`;
}

function modelDetailHtml(rep, m) {
  let delta = '—';
  if (m.previousCost != null) delta = m.previousCost < 0.005 ? (m.cost > 0 ? 'new' : '—') : `${m.cost >= m.previousCost ? '↑' : '↓'} ${Math.abs(Math.round((m.cost / m.previousCost - 1) * 100))}%`;
  const tok = m.prompt + m.completion;
  const cells = [
    ['Requests', groupInt(Math.round(m.requests))],
    ['Per request', m.requests > 0 ? money(m.cost / m.requests) : '—'],
    ['vs previous', delta],
    ['Tokens in / out', tok > 0 ? compact(m.prompt) + ' / ' + compact(m.completion) : '—'],
    ['Cache hit', m.prompt > 0 ? pct(m.cached / m.prompt) : '—'],
    ['Per 1M tokens', m.costPerMTok == null ? '—' : money(m.costPerMTok)]
  ];
  return `<div class="mdetail"><div class="kv">${cells.map(([k, v]) => `<div><div class="k">${k}</div><div class="v">${esc(v)}</div></div>`).join('')}</div>${tok === 0 ? '<p class="note-row" style="padding-bottom:0">No token counts: this model is billed another way, such as per minute of audio.</p>' : ''}</div>`;
}

function mixHtml(rep) {
  const f = focusRange();
  const head = (side) => `<div class="sec-h"><h2 id="h-mix">Token mix <span class="scope">· ${esc(scopeLabel(rep))}</span></h2><span class="side">${side}</span></div>`;
  let x = rep.mix;
  if (f) {
    const a = aggregate(rep, f);
    if (a.todayOnly) return head('') + '<p class="note-row">Token counts for today arrive after the UTC day ends.</p>';
    x = a.mix;
  }
  const prompt = x.cachedPrompt + x.uncachedPrompt;
  if (prompt + x.completion === 0) return head('') + `<p class="note-row">No tokens ${f ? 'on this day' : 'in this range'}.</p>`;
  const ratio = x.completion > 0 ? prompt / x.completion : null;
  const cell = (k, v, s) => `<div><div class="k">${k}</div><div class="v">${esc(compact(v))}</div><div class="s">${esc(s)}</div></div>`;
  return head(compact(prompt + x.completion) + ' tokens') + `<div class="quad-top">${prompt > 0 ? `<span><b>${pct(x.cachedPrompt / prompt)}</b> cache hit</span>` : ''}${ratio != null ? `<span>·</span><span><b>${ratio >= 10 ? Math.round(ratio) : ratio.toFixed(1)}:1</b> prompt to output</span>` : ''}</div>
    <div class="quad">
      ${cell('Cached prompt', x.cachedPrompt, prompt ? pct(x.cachedPrompt / prompt) + ' of prompt' : '')}
      ${cell('Uncached prompt', x.uncachedPrompt, prompt ? pct(x.uncachedPrompt / prompt) + ' of prompt' : '')}
      ${cell('Completion', x.completion, x.reasoning > 0 ? 'includes reasoning' : 'output tokens')}
      ${cell('Reasoning', x.reasoning, x.completion ? pct(x.reasoning / x.completion) + ' of completion' : '')}
    </div>`;
}

function usageHtml(rep) {
  const seg = (list, cur, act, label) => `<div class="seg sm" role="radiogroup" aria-label="${label}">${list.map(([v, l]) => `<button type="button" role="radio" aria-checked="${cur === v}" tabindex="${cur === v ? 0 : -1}" data-act="${act}" data-val="${v}" data-fk="${act}:${v}">${l}</button>`).join('')}</div>`;
  return `${todayMonthHtml(rep)}
    <section aria-labelledby="h-spend">
      <div class="sec-h"><h2 id="h-spend">${TOK() ? 'Tokens' : 'Spend'}</h2><div class="ctl">${seg(RANGES, state.range, 'range', 'Range')}${seg(MEASURES, state.measure, 'measure', 'Measure')}</div></div>
      <div id="u-readout">${readoutHtml(rep)}</div>
      <svg class="chart${state.model ? ' sel' : ''}" role="group" aria-label="${TOK() ? 'Daily tokens' : 'Daily spend'}. Arrow keys move, Enter selects a day."></svg>
    </section>
    <section aria-labelledby="h-models" id="u-models">${modelsHtml(rep)}</section>
    <section aria-labelledby="h-mix" id="u-mix">${mixHtml(rep)}</section>
    <section aria-labelledby="h-heat">
      <div class="sec-h"><h2 id="h-heat">Activity <span class="scope">· 26 weeks</span></h2><span class="side" id="heat-ro" aria-live="polite"></span></div>
      <svg class="heat" role="grid" aria-label="Daily ${TOK() ? 'tokens' : 'spend'} for 26 weeks. Arrow keys move, Enter selects a day."></svg>
      <div class="heat-foot"><span class="scale" aria-hidden="true">Less <i style="background:var(--h0)"></i><i style="background:var(--h1)"></i><i style="background:var(--h2)"></i><i style="background:var(--h3)"></i><i style="background:var(--h4)"></i> More</span><span>Click a day to select it</span></div>
    </section>`;
}

/* ---------- chart and heatmap (drawn after layout, at the real width) ---------- */

function drawChart() {
  const rep = state.report;
  const svg = $('#app .chart');
  if (!svg || !rep) return;
  const bs = buckets(rep);
  const W = Math.max(200, Math.round(svg.getBoundingClientRect().width)), H = 132;
  const L = TOK() ? 34 : 34, R = 4, T = 8, B = 18;
  if (!bs.length) { svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.innerHTML = `<text class="tick" x="${W / 2}" y="${H / 2}" text-anchor="middle">No activity yet</text>`; return; }
  const maxV = Math.max(1e-9, ...bs.map((b) => b.total));
  const step = niceStep(maxV), top = Math.ceil(maxV / step - 1e-9) * step;
  const y = (v) => T + (H - T - B) * (1 - v / top);
  const band = (W - L - R) / bs.length;
  const bw = Math.min(16, Math.max(2, band * 0.72)), rad = Math.min(3, bw / 2);
  const f = focusRange();
  const tickLbl = (v) => (TOK() ? compact(v) : '$' + (step < 1 ? v.toFixed(step < 0.1 ? 2 : 1) : groupInt(Math.round(v))));
  let g = '';
  for (let v = 0; v <= top + step * 1e-6; v += step) g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/><text class="tick" x="${L - 6}" y="${(y(v) + 3).toFixed(1)}" text-anchor="end">${tickLbl(v)}</text>`;
  const barPath = (x, y0, y1) => { const h = y0 - y1; if (h <= 0.5) return `M${x},${y0}h${bw}v-0.5h-${bw}Z`; const r = Math.min(rad, h); return `M${x},${y0}V${y1 + r}Q${x},${y1} ${x + r},${y1}H${x + bw - r}Q${x + bw},${y1} ${x + bw},${y1 + r}V${y0}Z`; };
  const fi = f ? bs.findIndex((b) => f.from >= b.from && f.from <= b.to) : -1;
  const tabI = fi >= 0 ? fi : bs.length - 1;
  let cols = '';
  bs.forEach((b, i) => {
    const x = L + band * i + (band - bw) / 2, base = y(0);
    let marks = `<path class="${b.partial && !b.week ? 'b-today' : 'b-total'}" d="${barPath(x, base, y(b.total))}"/>`;
    if (state.model) { const mv = b.byModel[state.model] || 0; if (mv > 0) marks += `<path class="b-model" d="${barPath(x, base, y(mv))}"/>`; }
    const lab = `${b.week ? 'Week of ' + dShort(b.from) : dLong(b.from)}: ${fmtV(b.total)}${b.partial ? ' so far' : ''}`;
    cols += `<g class="col${fi >= 0 && fi !== i ? ' dim' : ''}" data-b="${i}">${marks}<rect class="hit" x="${(L + band * i).toFixed(1)}" y="${T}" width="${band.toFixed(1)}" height="${H - T}" tabindex="${i === tabI ? 0 : -1}" role="img" aria-label="${esc(lab)}" data-fk="bar:${i}"/></g>`;
  });
  // The 7-day burn behind "days left", drawn only over the days it averages.
  let ref = '';
  const burn = rep.balance.burnPerDay;
  if (!TOK() && !state.model && rep.range !== 'all' && burn) {
    const last7 = bs.map((b, i) => (!b.partial ? i : -1)).filter((i) => i >= 0).slice(-7);
    if (last7.length) {
      const xa = L + band * last7[0] + (band - bw) / 2, xb = L + band * last7[last7.length - 1] + (band + bw) / 2, yy = Math.max(T + 2, y(Math.min(burn, top)));
      const lbl = money(burn) + '/day';
      ref = `<line class="ref" x1="${xa.toFixed(1)}" x2="${xb.toFixed(1)}" y1="${yy.toFixed(1)}" y2="${yy.toFixed(1)}"/>`;
      ref += xa - L > 64
        ? `<text class="ref-l" x="${(xa - 4).toFixed(1)}" y="${(yy + 3.5).toFixed(1)}" text-anchor="end" paint-order="stroke" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round">${lbl}</text>`
        : `<text class="ref-l" x="${xa.toFixed(1)}" y="${(yy - 5).toFixed(1)}" text-anchor="start" paint-order="stroke" stroke="var(--bg)" stroke-width="4" stroke-linejoin="round">${lbl}</text>`;
    }
  }
  const xl = (i, anchor) => `<text class="tick" x="${(L + band * i + band / 2).toFixed(1)}" y="${H - 4}" text-anchor="${anchor}">${bs[i].partial ? (bs[i].week ? 'This week' : 'Today') : dShort(bs[i].from)}</text>`;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.innerHTML = g + cols + ref + xl(0, 'start') + (bs.length > 2 ? xl(Math.floor((bs.length - 1) / 2), 'middle') : '') + (bs.length > 1 ? xl(bs.length - 1, 'end') : '');
}

function heatDays(rep) {
  const today = utcToday();
  const by = new Map(rep.heatmap.map((h) => [h.date, h]));
  const out = [];
  for (let i = HEAT_DAYS - 1; i >= 0; i--) {
    const d = addDays(today, -i);
    const h = by.get(d);
    const v = d === today ? (TOK() ? null : rep.tiles.today) : h ? (TOK() ? h.tokens || 0 : h.cost) : 0;
    out.push({ date: d, v, today: d === today });
  }
  return out;
}

function drawHeat() {
  const rep = state.report;
  const svg = $('#app .heat');
  if (!svg || !rep) return;
  const days = heatDays(rep);
  const W = Math.max(200, Math.round(svg.getBoundingClientRect().width));
  const off = (weekday(days[0].date) + 6) % 7, cols = Math.floor((days.length - 1 + off) / 7) + 1;
  const LW = 24, TOPH = 14, cell = (W - LW) / cols, sz = Math.max(4, cell - 2.2), H = TOPH + 7 * cell;
  const nz = days.map((d) => d.v).filter((v) => v > 0).sort((a, b) => a - b);
  const q = [0.25, 0.5, 0.8].map((p) => nz[Math.floor(p * (nz.length - 1))]);
  const lvl = (v) => (v == null || v <= 0 ? 0 : v <= q[0] ? 1 : v <= q[1] ? 2 : v <= q[2] ? 3 : 4);
  const pinned = state.pin && state.pin.from === state.pin.to ? state.pin.from : null;
  const focusD = pinned || state.heatFocus || days[days.length - 1].date;
  let s = '';
  ['Mon', '', 'Wed', '', 'Fri', '', ''].forEach((l, r) => { if (l) s += `<text class="tick" x="0" y="${(TOPH + r * cell + sz - 1).toFixed(1)}">${l}</text>`; });
  let lastMo = -1;
  for (let c = 0; c < cols; c++) {
    const di = c * 7 - off;
    if (di < 0) continue;
    const d = days[di].date, mo = +d.slice(5, 7) - 1;
    if (mo !== lastMo && +d.slice(8, 10) <= 7 && c < cols - 2) { s += `<text class="tick" x="${(LW + c * cell).toFixed(1)}" y="10">${MONTHS[mo]}</text>`; lastMo = mo; }
  }
  days.forEach((d, i) => {
    const k = i + off, c = Math.floor(k / 7), r = k % 7;
    const cls = 'cell' + (d.today ? ' today' : '') + (pinned === d.date ? ' pinned' : '');
    const lab = dLong(d.date) + ': ' + (d.v == null ? 'tokens pending' : d.v > 0 ? fmtV(d.v) : 'no usage');
    s += `<rect class="${cls}" data-d="${d.date}" x="${(LW + c * cell).toFixed(1)}" y="${(TOPH + r * cell).toFixed(1)}" width="${sz.toFixed(1)}" height="${sz.toFixed(1)}" rx="2" fill="var(--h${lvl(d.v)})" tabindex="${d.date === focusD ? 0 : -1}" role="gridcell" aria-label="${esc(lab)}" data-fk="cell:${d.date}"/>`;
  });
  svg.setAttribute('viewBox', `0 0 ${W} ${H.toFixed(1)}`);
  svg.style.height = H.toFixed(1) + 'px';
  svg.innerHTML = s;
  heatReadout(null);
}

function heatReadout(date) {
  const el = $('#heat-ro');
  const rep = state.report;
  if (!el || !rep) return;
  const days = heatDays(rep);
  if (!date) {
    const tot = days.reduce((a, d) => a + (d.v || 0), 0);
    el.textContent = (TOK() ? compact(tot) + ' tokens' : money(tot)) + ' in total';
    return;
  }
  const d = days.find((x) => x.date === date);
  if (d) el.textContent = dLong(d.date) + ' · ' + (d.v == null ? 'tokens pending' : d.v > 0 ? fmtV(d.v) : 'no usage');
}

// Hovering or selecting a day re-draws only what depends on it.
function updateFocus() {
  const rep = state.report;
  if (!rep || state.tab !== 'usage') return;
  const ro = $('#u-readout'), mo = $('#u-models'), mx = $('#u-mix');
  if (ro) ro.innerHTML = readoutHtml(rep);
  if (mo) mo.innerHTML = modelsHtml(rep);
  if (mx) mx.innerHTML = mixHtml(rep);
  const f = focusRange();
  const bs = buckets(rep);
  const fi = f ? bs.findIndex((b) => f.from >= b.from && f.from <= b.to) : -1;
  document.querySelectorAll('#app .chart .col').forEach((g) => g.classList.toggle('dim', fi >= 0 && +g.dataset.b !== fi));
}

function pinRange(r) {
  const same = state.pin && r && state.pin.from === r.from && state.pin.to === r.to;
  state.pin = same ? null : r;
  state.hover = null;
  state.modelsAll = false;
  if (state.pin) state.model = null;
  render();
}

function pinDate(date) {
  const rep = state.report;
  if (!rep) return;
  const today = utcToday();
  const inRange = rep.daily.some((d) => d.date === date);
  if (inRange) { state.heatFocus = date; pinRange({ from: date, to: date }); return; }
  // Outside the current range: widen it, then select the day once the report is in.
  const range = date >= addDays(today, -30) ? '30d' : 'all';
  if (range === state.range) return;
  state.range = range;
  state.pendingPin = date;
  state.heatFocus = date;
  savePrefs();
  loadReport();
}

/* ---------- rendering: keys ---------- */

function keysHtml(rep) {
  const r = state.keysRange;
  const all = rep.keys || [];
  const expired = (k) => k.health && k.health.expiry === 'expired';
  const isInactive = (k) => k.disabled || expired(k) || (!k.lastUsedAt && !(keySpend(k, 'all') > 0));
  const active = all.filter((k) => !isInactive(k)).sort((a, b) => (keySpend(b, r) ?? -1) - (keySpend(a, r) ?? -1));
  const inactive = all.filter(isInactive);
  const total = active.reduce((s, k) => s + (keySpend(k, r) || 0), 0);
  const seg = `<div class="seg sm" role="radiogroup" aria-label="Key spend range">${RANGES.map(([v, l]) => `<button type="button" role="radio" aria-checked="${r === v}" tabindex="${r === v ? 0 : -1}" data-act="krange" data-val="${v}" data-fk="krange:${v}">${l}</button>`).join('')}</div>`;
  const badges = (k) => {
    const h = k.health || {};
    const b = [];
    if (k.disabled) b.push(['neutral', 'Disabled']);
    if (h.expiry === 'expired') b.push(['danger', 'Expired']);
    else if (h.expiry === 'expiring' && k.expiresAt) b.push(['warn', 'Expires ' + dShort(k.expiresAt.slice(0, 10))]);
    if (h.limit === 'exhausted') b.push(['danger', 'Limit reached']);
    else if (h.limit === 'near') b.push(['warn', 'Near limit']);
    return b.map(([t, l]) => `<span class="badge ${t}">${esc(l)}</span>`).join('');
  };
  const row = (k, quiet) => {
    const s = keySpend(k, r);
    const h = k.health || {};
    const used = h.usedFraction;
    const meta = [k.lastUsedAt ? 'used ' + relTime(k.lastUsedAt) : 'never used', k.name && k.label ? k.label : ''].filter(Boolean).join(' · ');
    const limit = k.limit != null && !quiet ? `<div class="kmeter"><div class="meter" role="meter" aria-label="${esc(keyName(k))} limit used" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round((used || 0) * 100)}"><i class="now${h.limit ? ' warn' : ''}" style="width:${((used || 0) * 100).toFixed(1)}%"></i></div>
      <div class="k2"><span>${pct(used || 0)} of ${esc(money(k.limit))}${k.limitReset ? ' ' + RESET[k.limitReset] : ''} limit</span><span>${k.limitRemaining != null ? esc(money(Math.max(0, k.limitRemaining))) + ' left' : ''}${k.limitReset ? ' · resets ' + RESET[k.limitReset] : ''}</span></div></div>` : '';
    return `<li class="krow"><div class="k1"><span class="n"${quiet ? ' style="color:var(--fg-2)"' : ''} title="${esc(keyName(k))}">${esc(keyName(k))}</span>${badges(k)}<span class="v"${s == null ? ' title="Still loading this key\'s activity"' : ''}>${s == null ? '—' : esc(money(s))}</span></div><div class="k2"><span>${esc(meta)}</span></div>${limit}</li>`;
  };
  const scope = r === 'all' ? 'all time' : 'last ' + RANGE_DAYS[r] + ' days';
  return `<section aria-labelledby="h-keys">
    <div class="sec-h"><h2 id="h-keys">API keys <span class="scope">· ${scope}</span></h2><div class="ctl">${seg}</div></div>
    ${active.length || inactive.length ? '' : '<p class="note-row">No API keys on this account yet.</p>'}
    ${active.length ? `<ul class="klist">${active.map((k) => row(k, false)).join('')}</ul><p class="fine" style="margin-top:6px">${active.length} active key${active.length === 1 ? '' : 's'} · ${esc(money(total))} in total</p>` : ''}
    ${inactive.length ? `<button type="button" class="inactive" data-act="inactive" data-fk="inactive" aria-expanded="${state.inactiveOpen}"><span>${inactive.length} inactive key${inactive.length === 1 ? '' : 's'}</span><span class="muted">${state.inactiveOpen ? 'Hide' : 'Show'}</span></button>
      ${state.inactiveOpen ? `<ul class="klist">${inactive.map((k) => row(k, true)).join('')}</ul>` : ''}` : ''}
  </section>`;
}

/* ---------- rendering: settings ---------- */

function keyFormHtml(primaryLabel) {
  const m = state.keyMsg;
  return `<div class="keyform">
    <label class="sr-only" for="mgmt">Management key</label>
    <input id="mgmt" type="password" placeholder="Paste a management key" autocomplete="off" autocapitalize="off" spellcheck="false" data-fk="mgmt">
    <div class="acts"><button type="button" class="btn primary" id="save-keys" data-act="save-keys" data-fk="save-keys">${primaryLabel || 'Verify &amp; save'}</button><button type="button" class="link" data-act="open-keys" data-fk="open-keys">Create a management key ${ICON.ext}</button></div>
    <p id="key-msg" class="msg${m ? (m.ok ? ' ok-t' : ' err-t') : ''}"${m && !m.ok ? ' role="alert"' : ' role="status"'}>${m ? esc(m.text) : ''}</p>
  </div>`;
}

function settingsHtml() {
  const st = state.status || {};
  const s = state.settings;
  const row = (t, d, ctl, dis) => `<div class="srow${dis ? ' dis' : ''}"><div><div class="t">${t}</div>${d ? `<div class="d">${d}</div>` : ''}</div>${ctl}</div>`;
  const num = (key, label, pre, suf, attrs) => `<label class="num">${pre || ''}<input type="number" inputmode="decimal" ${attrs} value="${esc(s[key])}" aria-label="${esc(label)}" data-set="${key}" data-fk="set:${key}">${suf || ''}</label>`;
  const sw = (key, label) => `<input type="checkbox" class="switch" role="switch" aria-label="${esc(label)}" data-set="${key}" data-fk="set:${key}"${s[key] ? ' checked' : ''}>`;
  const r = state.connRes;
  const conn = state.confirmDisc
    ? `<div class="confirm"><span>Remove the stored key from Orca?</span><button type="button" class="btn danger" data-act="disconnect-yes" data-fk="disconnect-yes">Disconnect</button><button type="button" class="btn ghost" data-act="disconnect-no" data-fk="disconnect-no">Cancel</button></div>`
    : `<button type="button" class="btn" data-act="conn-test" data-fk="conn-test">${state.connBusy ? '<span class="spinner" aria-hidden="true"></span>Testing…' : 'Test connection'}</button><button type="button" class="btn" data-act="replace" data-fk="replace" aria-expanded="${state.replaceOpen}">Replace key</button><button type="button" class="btn ghost danger" data-act="disconnect-ask" data-fk="disconnect-ask">Disconnect</button>`;
  const recent = state.savedAt && Date.now() - state.savedAt < 1600;
  const opts = !s
    ? `<p class="${state.settingsErr ? 'err-t' : 'muted'}">${state.settingsErr ? 'Could not load settings: ' + esc(state.settingsErr) : 'Loading settings…'}</p>`
    : `<section aria-labelledby="h-alerts">
      <div class="sec-h"><h2 id="h-alerts">Refresh and alerts</h2><span id="set-saved" class="${recent ? 'saved' : 'side'}" role="status">${recent ? 'Saved' : 'Saves when you leave a field'}</span></div>
      ${row('Refresh every', 'How often Orca checks OpenRouter', num('refreshMinutes', 'Refresh interval in minutes', '', 'min', 'min="1" max="120" step="1"'))}
      ${row('Low-balance alert', 'Warn when credits drop below this. 0 turns it off.', num('lowBalanceUsd', 'Low balance alert in dollars', '$', '', 'min="0" step="any"'))}
      ${row('Daily budget', "Notify once when today's spend passes it. 0 turns it off.", num('dailyBudgetUsd', 'Daily budget in dollars', '$', '', 'min="0" step="any"'))}
      ${row('Monthly budget', 'Warn when spend or its pace passes it. 0 turns it off.', num('monthlyBudgetUsd', 'Monthly budget in dollars', '$', '', 'min="0" step="any"'))}
      ${row('Desktop notifications', 'For low balance and budgets', sw('notifications', 'Desktop notifications'))}
    </section>
    <section aria-labelledby="h-sb">
      <h2 id="h-sb">Status bar</h2>
      ${row('Show credits in the status bar', '', sw('statusBar', 'Show credits in the status bar'))}
      ${row('Next to credits', '', `<select class="select" aria-label="Status bar shows" data-set="statusBarContent" data-fk="set:statusBarContent"${s.statusBar ? '' : ' disabled'}>${SBC.map(([v, l]) => `<option value="${v}"${s.statusBarContent === v ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select>`, !s.statusBar)}
    </section>
    <section aria-labelledby="h-spendset">
      <h2 id="h-spendset">Spend</h2>
      ${row('Count BYOK usage', 'Include requests made with your own provider keys', sw('includeByok', 'Count BYOK usage in spend'))}
    </section>`;
  return `<section aria-labelledby="h-conn">
      <h2 id="h-conn">Connection</h2>
      <div class="conn"><span class="ic">${ICON.check}</span><div class="who"><b>${esc(st.keyLabel || 'Management key')}</b><div>Management key, stored in Orca's encrypted secrets</div></div></div>
      ${r ? `<p class="conn-res ${r.ok ? 'ok-t' : 'err-t'}" role="${r.ok ? 'status' : 'alert'}">${r.ok ? 'Connected as ' + esc(r.label) : esc(r.error)}</p>` : ''}
      <div class="conn-acts">${conn}</div>
      ${state.replaceOpen ? keyFormHtml() : ''}
    </section>
    ${opts}
    <section aria-label="About the numbers">
      <p class="fine">Today is approximate because it comes from key totals. Ranges longer than 30 days fill in from the day you installed.</p>
      <p class="fine">Days follow UTC. For you a new day starts at ${esc(utcDayStartLocal())}.</p>
    </section>`;
}

/* ---------- rendering: the rest ---------- */

function setupHtml() {
  return `<section class="setup" aria-labelledby="h-setup">
    <h1 id="h-setup">Connect your OpenRouter account</h1>
    <p>A <strong>management key</strong> is needed to read your credits, activity and keys. It is verified once, then stored encrypted by Orca; this panel never keeps it.</p>
    ${keyFormHtml()}
  </section>`;
}

function skeletonHtml() {
  return `<div role="status" aria-label="Loading usage" style="display:flex;flex-direction:column;gap:12px">
    <div class="skel" style="height:52px"></div><div class="skel" style="height:150px"></div><div class="skel" style="height:180px"></div></div>`;
}

const mentionsKey = (t) => /key/i.test(String(t || ''));
const errActions = (text) => `<button type="button" class="btn" data-act="refresh" data-fk="try-again">Try again</button>${mentionsKey(text) ? '<button type="button" class="btn" data-act="go-settings" data-fk="go-settings">Replace the key in Settings</button>' : ''}`;

function noticesHtml() {
  const rep = state.report;
  let h = '';
  if (state.notice) h += `<div class="notice err" role="alert"><span>${esc(state.notice)}</span><button type="button" class="btn ghost" data-act="dismiss-notice" data-fk="dismiss-notice">Dismiss</button></div>`;
  if (state.error && state.status) h += `<div class="notice err" role="alert"><span>Could not load the report: ${esc(state.error)}</span><button type="button" class="btn" data-act="retry" data-fk="retry">Retry</button></div>`;
  if (rep && rep.stale) h += `<div class="notice" role="status"><span>Offline since ${esc(absTime(rep.stale.since))}, showing cached data: ${esc(rep.stale.error)}</span>${errActions(rep.stale.error)}</div>`;
  return h;
}

function footHtml() {
  const st = state.status;
  const rep = state.report;
  const t = (st && st.lastRefreshAt) || (rep && rep.generatedAt);
  return `<div class="p-foot">${t ? `<span data-rel="${t}" data-prefix="Updated ">Updated ${relTime(t)}</span>` : '<span>Not refreshed yet</span>'}<span title="For you a new day starts at ${esc(utcDayStartLocal())}">Days are UTC</span></div>`;
}

function bodyHtml() {
  const st = state.status;
  if (!st) return state.error ? `<div class="notice err" role="alert"><span>Could not reach the plugin: ${esc(state.error)}</span><button type="button" class="btn" data-act="retry" data-fk="retry">Retry</button></div>` : skeletonHtml();
  if (!st.configured) return setupHtml();
  let h = bannerHtml() + warningsHtml() + topHtml() + noticesHtml();
  const rep = state.report;
  if (state.tab === 'settings') h += settingsHtml();
  else if (rep) h += `<div class="${state.loading ? 'busy' : ''}" style="display:flex;flex-direction:column;gap:18px;min-width:0">${state.tab === 'keys' ? keysHtml(rep) : usageHtml(rep)}</div>`;
  else if (!state.error) {
    if (st.lastError && !state.loading) h += `<div class="notice err" role="alert"><span><b>Couldn't load your usage.</b> ${esc(st.lastError)} It keeps retrying automatically.</span>${errActions(st.lastError)}</div>`;
    else h += skeletonHtml();
  }
  return h + footHtml();
}

function render() {
  const app = $('#app');
  const active = document.activeElement;
  const fk = (active && active.getAttribute && active.getAttribute('data-fk')) || '';
  // Background refreshes re-render everything. Keep what the person is typing.
  const keep = {};
  app.querySelectorAll('input[type="password"], input[type="number"]').forEach((el) => {
    const k = el.id || el.getAttribute('data-fk');
    if (k && (el.type === 'password' || el === active)) keep[k] = { v: el.value, a: el.selectionStart, b: el.selectionEnd };
  });
  app.innerHTML = bodyHtml();
  Object.keys(keep).forEach((id) => {
    const el = document.getElementById(id) || [...app.querySelectorAll('input[data-fk]')].find((e) => e.getAttribute('data-fk') === id);
    if (el && el.value !== keep[id].v) {
      el.value = keep[id].v;
      try { if (keep[id].a != null) el.setSelectionRange(keep[id].a, keep[id].b); } catch (e) { /* not selectable */ }
    }
  });
  if (state.tab === 'usage') { drawChart(); drawHeat(); }
  if (fk) focusFk(fk);
}

function focusFk(fk) {
  const el = [...$('#app').querySelectorAll('[data-fk]')].find((e) => e.getAttribute('data-fk') === fk);
  if (!el) return false;
  el.focus({ preventScroll: true });
  return true;
}

/* ---------- state transitions ---------- */

async function refreshStatus() {
  try {
    state.status = await req('status.get');
    state.error = null;
  } catch (e) {
    state.error = errMsg(e);
  }
  if (state.status && state.status.configured) {
    if (!state.report) loadReport();
    else render();
  } else {
    state.report = null;
    render();
  }
}

async function loadReport(quiet) {
  if (!state.status || !state.status.configured) { render(); return; }
  const my = ++reqSeq;
  if (!quiet) { state.loading = true; render(); }
  let rep = null, err = null;
  try {
    rep = await req('report.get', { range: state.range, measure: state.measure });
  } catch (e) {
    err = errMsg(e);
  }
  if (my !== reqSeq) return;
  state.loading = false;
  state.error = err;
  if (!err) state.report = rep || null;
  const r = state.report;
  if (r) {
    if (state.pendingPin) {
      const d = state.pendingPin;
      state.pendingPin = null;
      state.pin = r.daily.some((x) => x.date === d) ? { from: d, to: d } : null;
    } else if (state.pin && !r.daily.some((x) => x.date === state.pin.from)) state.pin = null;
    if (state.model && !r.models.some((m) => m.name === state.model)) state.model = null;
  }
  state.hover = null;
  render();
  if (devHook && state.report) { const h = devHook; devHook = null; h(); }
}

async function doRefresh(quiet) {
  if (state.refreshing) return;
  state.refreshing = true;
  quietRun = !!quiet;
  if (!quiet) { state.notice = ''; render(); }
  let res;
  try {
    res = await req('refresh');
  } catch (e) {
    res = { ok: false, error: errMsg(e) };
  }
  state.refreshing = false;
  quietRun = false;
  if (!quiet && (!res || res.ok === false)) state.notice = 'Refresh failed: ' + ((res && res.error) || 'unknown error');
  try { state.status = await req('status.get'); } catch (e) { /* keep the last status */ }
  render();
  if (quiet || !state.notice) loadReport(quiet);
}

function maybeAutoRefresh() {
  const st = state.status;
  if (!st || !st.configured || st.refreshing || state.refreshing) return;
  const now = Date.now();
  if (st.lastRefreshAt != null && now - st.lastRefreshAt < AUTO_STALE_MS) return;
  if (now - lastAutoAt < AUTO_GAP_MS) return;
  lastAutoAt = now;
  doRefresh(true);
}

function setKeyMsg(ok, text) {
  state.keyMsg = { ok, text };
  const el = $('#key-msg');
  if (el) { el.className = 'msg ' + (ok ? 'ok-t' : 'err-t'); el.textContent = text; }
}

async function saveKeys() {
  const mEl = $('#mgmt'), btn = $('#save-keys');
  if (!mEl || !btn || btn.disabled) return;
  const m = mEl.value.trim();
  if (!m) { setKeyMsg(false, 'Enter your management key first.'); mEl.focus(); return; }
  btn.disabled = true;
  btn.textContent = 'Verifying…';
  setKeyMsg(true, '');
  state.keyMsg = null;
  let res;
  try { res = await req('keys.save', { mgmtKey: m }); } catch (e) { res = { ok: false, error: errMsg(e) }; }
  if (res && res.ok) {
    mEl.value = '';
    state.keyMsg = { ok: true, text: 'Key verified and saved' };
    state.replaceOpen = false;
    state.report = null;
    await refreshStatus();
  } else {
    btn.disabled = false;
    btn.textContent = 'Verify & save';
    setKeyMsg(false, (res && res.error) || 'Could not verify the key.');
  }
}

async function testConnection() {
  if (state.connBusy) return;
  state.connBusy = true;
  state.connRes = null;
  render();
  let res;
  try { res = await req('connection.test'); } catch (e) { res = { ok: false, error: errMsg(e) }; }
  state.connBusy = false;
  state.connRes = res && res.ok ? { ok: true, label: res.label } : { ok: false, error: (res && res.error) || 'Connection test failed.' };
  render();
}

async function disconnect() {
  state.confirmDisc = false;
  try { await req('keys.clear'); } catch (e) { state.notice = 'Could not disconnect: ' + errMsg(e); }
  await refreshStatus();
}

async function loadSettings() {
  try {
    state.settings = await req('settings.get');
    state.settingsErr = null;
  } catch (e) {
    state.settingsErr = errMsg(e);
  }
  render();
}

async function exportCsv(kind) {
  if (state.exporting) return;
  state.exporting = true;
  state.menu = false;
  state.exportMessage = null;
  state.notice = '';
  render();
  try {
    if (!host().files) throw new Error('Saving files requires the Orca desktop app.');
    const range = kind === 'keys' ? state.keysRange : state.range;
    const options = await req('export.csv', { range, kind });
    const result = await host().files.saveAs(options);
    state.exportMessage = result.status === 'saved' ? { ok: true, text: 'CSV saved' } : { ok: false, text: 'Export cancelled' };
  } catch (e) {
    state.notice = 'Export failed: ' + errMsg(e);
  } finally {
    state.exporting = false;
    render();
    setTimeout(() => { if (state.exportMessage) { state.exportMessage = null; render(); } }, 4000);
  }
}

function saveSetting(field, value) {
  req('settings.set', { [field]: value }).then((s) => {
    state.settings = s;
    state.settingsErr = null;
    state.savedAt = Date.now();
    render();
    const at = state.savedAt;
    setTimeout(() => {
      if (state.savedAt !== at) return;
      const m = $('#set-saved');
      if (m) { m.className = 'side'; m.textContent = 'Saves when you leave a field'; }
    }, 1500);
    if (field === 'includeByok' || field === 'monthlyBudgetUsd' || field === 'lowBalanceUsd') loadReport(true);
  }).catch((e) => {
    state.notice = 'Could not save setting: ' + errMsg(e);
    render();
  });
}

function selectTab(id) {
  state.tab = id;
  state.menu = false;
  state.hover = null;
  if (id === 'settings') {
    state.keyMsg = null;
    state.connRes = null;
    state.confirmDisc = false;
    state.replaceOpen = false;
  }
  savePrefs();
  render();
  window.scrollTo(0, 0);
  if (id === 'settings') loadSettings();
}

/* ---------- events ---------- */

const app = $('#app');

app.addEventListener('click', (e) => {
  const cell = e.target.closest && e.target.closest('.heat .cell');
  if (cell) { pinDate(cell.dataset.d); return; }
  const hit = e.target.closest && e.target.closest('.chart .hit');
  if (hit && state.report) {
    const b = buckets(state.report)[+hit.parentNode.dataset.b];
    if (b) pinRange({ from: b.from, to: b.to });
    return;
  }
  const el = e.target.closest('[data-act]');
  if (!el) { if (state.menu) { state.menu = false; render(); } return; }
  const v = el.dataset.val;
  switch (el.dataset.act) {
    case 'tab': if (state.tab !== v) selectTab(v); break;
    case 'range':
      if (state.range !== v) { state.range = v; state.pin = null; state.hover = null; state.model = null; state.modelsAll = false; savePrefs(); loadReport(); }
      break;
    case 'measure':
      if (state.measure !== v) { state.measure = v; savePrefs(); loadReport(); }
      break;
    case 'krange':
      if (state.keysRange !== v) { state.keysRange = v; savePrefs(); render(); }
      break;
    case 'model': state.model = state.model === v ? null : v; render(); break;
    case 'models-more': state.modelsAll = !state.modelsAll; render(); break;
    case 'unpin': state.pin = null; state.hover = null; render(); break;
    case 'inactive': state.inactiveOpen = !state.inactiveOpen; render(); break;
    case 'menu': state.menu = !state.menu; render(); if (state.menu) focusFk('export:daily'); break;
    case 'export': exportCsv(v); break;
    case 'refresh': doRefresh(); break;
    case 'dismiss-warn': dismissed.add(v); saveDismissed(); render(); break;
    case 'add-credits': openUrl(CREDITS_URL); break;
    case 'conn-test': testConnection(); break;
    case 'replace': state.replaceOpen = !state.replaceOpen; state.keyMsg = null; render(); if (state.replaceOpen) focusFk('mgmt'); break;
    case 'retry': if (!state.status) refreshStatus(); else loadReport(); break;
    case 'go-settings': selectTab('settings'); state.replaceOpen = true; render(); break;
    case 'dismiss-notice': state.notice = ''; render(); break;
    case 'open-keys': openUrl(KEYS_URL); break;
    case 'save-keys': saveKeys(); break;
    case 'disconnect-ask': state.confirmDisc = true; render(); focusFk('disconnect-yes'); break;
    case 'disconnect-no': state.confirmDisc = false; render(); break;
    case 'disconnect-yes': disconnect(); break;
    default: break;
  }
});

// Settings save on change (blur or Enter for numbers), never per keystroke.
app.addEventListener('change', (e) => {
  const el = e.target;
  const field = el.dataset && el.dataset.set;
  if (!field) return;
  if (el.type === 'checkbox') { saveSetting(field, el.checked); return; }
  if (el.tagName === 'SELECT') { if (state.settings && el.value !== state.settings[field]) saveSetting(field, el.value); return; }
  const cur = state.settings ? state.settings[field] : '';
  const n = Number(el.value);
  const min = el.min === '' ? -Infinity : +el.min;
  const max = el.max === '' ? Infinity : +el.max;
  if (el.value === '' || !isFinite(n) || n < min || n > max) { el.value = cur; return; }
  if (n === cur) return;
  saveSetting(field, n);
});

app.addEventListener('pointerover', (e) => {
  const cell = e.target.closest && e.target.closest('.heat .cell');
  if (cell) { heatReadout(cell.dataset.d); return; }
  const hit = e.target.closest && e.target.closest('.chart .hit');
  if (!hit || state.pin || !state.report) return;
  const b = buckets(state.report)[+hit.parentNode.dataset.b];
  if (b && (!state.hover || state.hover.from !== b.from)) { state.hover = { from: b.from, to: b.to }; updateFocus(); }
});
app.addEventListener('pointerout', (e) => {
  const to = e.relatedTarget;
  if (e.target.closest && e.target.closest('.heat') && !(to && to.closest && to.closest('.heat'))) heatReadout(null);
  if (!state.hover || state.pin) return;
  if (!to || !to.closest || !to.closest('.chart')) { state.hover = null; updateFocus(); }
});

app.addEventListener('keydown', (e) => {
  const t = e.target;
  if (e.key === 'Enter' && t.tagName === 'INPUT') {
    if (t.closest('.keyform')) { e.preventDefault(); saveKeys(); return; }
    if (t.dataset.set && t.type === 'number') { e.preventDefault(); t.blur(); return; }
  }
  if (e.key === 'Escape') {
    if (state.menu) { state.menu = false; render(); focusFk('menu'); return; }
    if (state.pin) { state.pin = null; render(); return; }
  }
  const cell = t.closest && t.closest('.heat .cell');
  if (cell) {
    const d = cell.dataset.d;
    const delta = { ArrowLeft: -7, ArrowRight: 7, ArrowUp: -1, ArrowDown: 1 }[e.key];
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pinDate(d); return; }
    if (delta) {
      e.preventDefault();
      const n = addDays(d, delta);
      const next = $(`#app .heat .cell[data-d="${n}"]`);
      if (next) { cell.setAttribute('tabindex', '-1'); next.setAttribute('tabindex', '0'); next.focus(); state.heatFocus = n; heatReadout(n); }
    }
    return;
  }
  const hit = t.closest && t.closest('.chart .hit');
  if (hit && state.report) {
    const bs = buckets(state.report), i = +hit.parentNode.dataset.b;
    let n = null;
    if (e.key === 'ArrowLeft') n = Math.max(0, i - 1);
    if (e.key === 'ArrowRight') n = Math.min(bs.length - 1, i + 1);
    if (e.key === 'Home') n = 0;
    if (e.key === 'End') n = bs.length - 1;
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pinRange({ from: bs[i].from, to: bs[i].to }); focusFk('bar:' + i); return; }
    if (n != null) { e.preventDefault(); state.pin = { from: bs[n].from, to: bs[n].to }; state.hover = null; state.model = null; render(); focusFk('bar:' + n); }
    return;
  }
  const seg = t.closest && t.closest('.seg');
  if (seg && /^Arrow/.test(e.key)) {
    e.preventDefault();
    const btns = [...seg.querySelectorAll('button')];
    const i = btns.indexOf(t);
    const d = e.key === 'ArrowRight' || e.key === 'ArrowDown' ? 1 : -1;
    const nb = btns[(i + d + btns.length) % btns.length];
    nb.focus();
    nb.click();
  }
});

document.addEventListener('click', (e) => {
  if (state.menu && !(e.target.closest && e.target.closest('.menu-wrap'))) { state.menu = false; render(); }
});

let lastW = window.innerWidth;
let rzFrame = 0;
window.addEventListener('resize', () => {
  cancelAnimationFrame(rzFrame);
  rzFrame = requestAnimationFrame(() => {
    if (Math.abs(window.innerWidth - lastW) > 8 && state.tab === 'usage') { lastW = window.innerWidth; drawChart(); drawHeat(); }
  });
});

setInterval(() => {
  document.querySelectorAll('[data-rel]').forEach((el) => { el.textContent = (el.dataset.prefix || '') + relTime(+el.dataset.rel); });
}, 30000);

/* ---------- dev preview mock (only when no Orca host) ---------- */

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function makeMock() {
  const flags = location.hash.slice(1).split(',').filter(Boolean);
  const has = (f) => flags.includes(f);
  if (has('light') || (!has('dark') && window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches)) {
    document.documentElement.classList.add('light');
  }
  const rnd = mulberry32(20261110);
  const today = utcToday();
  const HISTORY = 60;
  const TOTAL_CREDITS = 85;
  const LABEL = 'sk-or-v1-abc...xyz';
  const MODELS = [
    { name: 'anthropic/claude-sonnet-4.5', w: 0.32, ppm: 3.0, reason: 0.3, cache: 0.9 },
    { name: 'openai/gpt-5-mini', w: 0.22, ppm: 0.25, reason: 0.4, cache: 0.6 },
    { name: 'google/gemini-2.5-flash', w: 0.18, ppm: 0.3, reason: 0.2, cache: 0.7 },
    { name: 'google/gemini-2.5-pro', w: 0.1, ppm: 1.25, reason: 0.5, cache: 0.5 },
    { name: 'deepseek/deepseek-chat', w: 0.1, ppm: 0.4, reason: 0, cache: 0.85 },
    { name: 'meta-llama/llama-3.3-70b-instruct', w: 0.08, ppm: 0.3, reason: 0, cache: 0.2 }
  ];
  if (has('many')) for (let i = 1; i <= 7; i++) MODELS.push({ name: 'vendor/extra-model-' + i, w: 0.02, ppm: 0.2 + i * 0.05, reason: 0, cache: 0.3 });
  const rows = [];
  for (let i = 0; i <= HISTORY; i++) {
    const date = addDays(today, -i);
    const weekend = [0, 6].includes(weekday(date));
    const day = (0.6 + 0.8 * rnd()) * (weekend ? 0.6 : 1) * (i === 0 ? 0.45 : 1);
    MODELS.forEach((m) => {
      const cost = round4(day * m.w * (0.7 + 0.6 * rnd()));
      if (cost <= 0) return;
      const tok = (cost / m.ppm) * 1e6;
      const prompt = Math.round(tok * 0.92);
      const completion = Math.round(tok * 0.08);
      rows.push({
        date, model: m.name, usage: cost, byokUsage: rnd() < 0.12 ? round4(cost * 0.25) : 0,
        requests: Math.max(1, Math.round(cost / (0.003 + m.ppm * 0.0009))),
        prompt, completion, reasoning: Math.round(completion * m.reason),
        cached: Math.round(prompt * Math.min(0.97, m.cache + (rnd() - 0.5) * 0.1))
      });
    });
  }
  const totalUsage = rows.reduce((a, r) => a + r.usage, 0);
  const hex = (n) => Array.from({ length: n }, () => Math.floor(rnd() * 16).toString(16)).join('');
  const KEYS = [
    { name: 'prod-api', expiresAt: new Date(Date.now() + 3 * 86400e3).toISOString(), limitReset: 'monthly', label: 'sk-or-v1-…a41f', limit: 50, usage: 18.8, d: 1.2, w: 6.4, m: 16.2, s7: 6.4, s30: 16.2, sAll: 18.8, agoMin: 7, disabled: false },
    { name: '', label: 'sk-or-v1-…9c02', limit: null, usage: 3.1, d: 0, w: 0.4, m: 1.7, s7: 0.4, s30: 1.7, sAll: 3.1, agoMin: 95, disabled: false },
    { name: 'n8n automations', limitReset: 'monthly', label: 'sk-or-v1-…72f4', limit: 20, usage: 19, d: 0.7, w: 3.9, m: 18.8, s7: 3.9, s30: 18.8, sAll: 19, agoMin: 180, disabled: false },
    { name: 'staging', expiresAt: new Date(Date.now() - 86400e3).toISOString(), label: '', limit: 10, usage: 0.4, d: 0, w: 0, m: 0.4, s7: 0, s30: 0.4, sAll: 0.4, agoMin: 5760, disabled: true },
    { name: 'laptop-cli', label: 'sk-or-v1-…e9f0', limit: null, usage: 5.6, d: 0.3, w: 1.9, m: 4.7, s7: 1.9, s30: 4.7, sAll: 5.6, agoMin: 30, disabled: false },
    { name: 'ci-bot', label: '', limit: null, usage: 0, d: 0, w: 0, m: 0, s7: 0, s30: 0, sAll: 0, agoMin: 2880, disabled: false },
    { name: 'old-experiments', label: '', limit: 25, usage: 0, d: 0, w: 0, m: 0, s7: 0, s30: 0, sAll: 0, agoMin: null, disabled: false }
  ].map((k) => ({ ...k, hash: hex(64) }));
  const keysFor = (range) => KEYS.map((k) => {
    const used = k.limitReset === 'monthly' ? k.m : k.usage;
    const spendByRange = { '7d': k.s7, '30d': k.s30, all: k.sAll };
    return {
      hash: k.hash, name: k.name, label: k.label, disabled: k.disabled, limit: k.limit,
      limitRemaining: k.limit == null ? null : Math.max(0, round2(k.limit - used)),
      usage: k.usage, usageDaily: k.d, usageWeekly: k.w, usageMonthly: k.m,
      byokUsage: 0, byokUsageDaily: 0, byokUsageWeekly: 0, byokUsageMonthly: 0,
      limitReset: k.limitReset || null, expiresAt: k.expiresAt || null, includeByokInLimit: false,
      health: { expiry: k.expiresAt ? Date.parse(k.expiresAt) <= Date.now() ? 'expired' : 'expiring' : null,
        limit: k.limit != null && used / k.limit >= 0.9 ? 'near' : null,
        usedFraction: k.limit != null ? used / k.limit : null },
      lastUsedAt: k.agoMin == null ? null : new Date(Date.now() - k.agoMin * 60e3).toISOString(),
      spend: spendByRange[range], spendByRange
    };
  });
  // #new: a brand-new account. #offline / #revoked: report unavailable, status carries the error.
  const NEW = has('new');
  const DOWN = has('offline') ? "Can't reach OpenRouter. Check your internet connection." : has('revoked') ? 'OpenRouter rejected this key. It may be mistyped or revoked.' : null;
  let configured = !has('setup');
  const settings = { refreshMinutes: 15, lowBalanceUsd: 10, dailyBudgetUsd: 0, monthlyBudgetUsd: has('budget') ? 25 : 0, notifications: true, statusBar: true, statusBarContent: 'credits-today', includeByok: true };
  const clampSettings = (p) => {
    const out = {};
    if ('refreshMinutes' in p) out.refreshMinutes = Math.min(120, Math.max(1, Math.round(+p.refreshMinutes) || 1));
    if ('lowBalanceUsd' in p) out.lowBalanceUsd = Math.max(0, +p.lowBalanceUsd || 0);
    if ('dailyBudgetUsd' in p) out.dailyBudgetUsd = Math.max(0, +p.dailyBudgetUsd || 0);
    if ('monthlyBudgetUsd' in p) out.monthlyBudgetUsd = Math.max(0, +p.monthlyBudgetUsd || 0);
    if ('statusBarContent' in p && SBC.some(([v]) => v === p.statusBarContent)) out.statusBarContent = p.statusBarContent;
    ['notifications', 'statusBar', 'includeByok'].forEach((k) => { if (k in p) out[k] = !!p[k]; });
    return out;
  };

  function mockReport(range, measure) {
    const span = range === '7d' ? 7 : range === '30d' ? 30 : HISTORY;
    const dates = [];
    for (let i = span; i >= 1; i--) dates.push(addDays(today, -i));
    const dset = new Set(dates);
    const cost = (r) => r.usage + (settings.includeByok ? r.byokUsage : 0);
    const val = (r) => (measure === 'tokens' ? r.prompt + r.completion : cost(r));
    const quiet = has('empty') || NEW;
    const rowsR = quiet ? [] : rows.filter((r) => dset.has(r.date));
    const sum = (arr, f) => arr.reduce((a, r) => a + f(r), 0);
    const spend = sum(rowsR, cost);
    const tokIn = sum(rowsR, (r) => r.prompt), tokOut = sum(rowsR, (r) => r.completion);
    const cached = sum(rowsR, (r) => r.cached), reasoning = sum(rowsR, (r) => r.reasoning);
    const requests = sum(rowsR, (r) => r.requests);
    const todayCost = quiet ? 0 : sum(rows.filter((r) => r.date === today), cost);
    const previousDates = new Set(Array.from({ length: span }, (_, i) => addDays(today, -span - i - 1)));
    const previousRows = quiet ? [] : rows.filter((r) => previousDates.has(r.date));
    const previous = sum(previousRows, cost);
    const comparison = range === 'all' || NEW ? null : { days: span, current: spend, previous, changePercent: previous > 0 ? (spend - previous) / previous * 100 : spend > 0 ? null : 0 };
    const daily = dates.map((date) => {
      const byModel = {};
      const mix = { cachedPrompt: 0, uncachedPrompt: 0, completion: 0, reasoning: 0 };
      let total = 0;
      rowsR.filter((r) => r.date === date).forEach((r) => {
        byModel[r.model] = round4((byModel[r.model] || 0) + val(r));
        total += val(r);
        mix.cachedPrompt += r.cached; mix.uncachedPrompt += r.prompt - r.cached; mix.completion += r.completion; mix.reasoning += r.reasoning;
      });
      return { date, total: round4(total), byModel, mix, partial: false };
    });
    if (measure === 'cost') daily.push({ date: today, total: todayCost, byModel: {}, mix: { cachedPrompt: 0, uncachedPrompt: 0, completion: 0, reasoning: 0 }, partial: true });
    const ranked = () => {
      const m = {};
      rowsR.forEach((r) => {
        const o = m[r.model] || (m[r.model] = { name: r.model, cost: 0, requests: 0, prompt: 0, completion: 0, reasoning: 0, cached: 0 });
        o.cost += cost(r); o.requests += r.requests; o.prompt += r.prompt; o.completion += r.completion; o.reasoning += r.reasoning; o.cached += r.cached;
      });
      return Object.values(m).map((o) => {
        const tok = o.prompt + o.completion;
        return { ...o, previousCost: comparison ? sum(previousRows.filter((r) => r.model === o.name), cost) : null, cost: round4(o.cost), costPerMTok: tok ? round4((o.cost / tok) * 1e6) : null, series: [] };
      }).sort((a, b) => (measure === 'tokens' ? b.prompt + b.completion - (a.prompt + a.completion) : b.cost - a.cost));
    };
    const heatBy = {};
    rows.forEach((r) => { const h = heatBy[r.date] || (heatBy[r.date] = { cost: 0, tokens: 0 }); h.cost += cost(r); h.tokens += r.prompt + r.completion; });
    const heatmap = [];
    for (let i = HISTORY; i >= 1; i--) {
      const d = addDays(today, -i);
      heatmap.push({ date: d, cost: quiet ? 0 : round4((heatBy[d] || {}).cost || 0), tokens: quiet ? 0 : (heatBy[d] || {}).tokens || 0 });
    }
    const yest = [1, 2, 3, 4, 5, 6, 7].map((i) => addDays(today, -i));
    const burnTotal = NEW ? 0 : rows.filter((r) => yest.includes(r.date)).reduce((a, r) => a + r.usage, 0);
    const burnPerDay = burnTotal > 0 ? round4(burnTotal / 7) : null;
    // #low: put the balance under the alert threshold.
    const remaining = NEW ? 0 : has('low') ? round2(Math.max(1, settings.lowBalanceUsd) * 0.7) : round2(TOTAL_CREDITS - totalUsage);
    const daysLeft = burnPerDay ? round2(remaining / burnPerDay) : null;
    const monthStart = today.slice(0, 8) + '01';
    const monthDone = (NEW ? [] : rows).filter((r) => r.date >= monthStart && r.date < today).reduce((a, r) => a + cost(r), 0);
    const monthToDate = round4(monthDone + todayCost);
    const dim = new Date(Date.UTC(+today.slice(0, 4), +today.slice(5, 7), 0)).getUTCDate();
    const recentSpend = NEW ? null : rows.filter((r) => yest.includes(r.date)).reduce((a, r) => a + cost(r), 0) / 7;
    const monthProjected = recentSpend == null ? null : round4(monthToDate + recentSpend * (dim - +today.slice(8, 10)));
    return {
      generatedAt: Date.now(), range, measure,
      balance: { remaining, burnPerDay, daysLeft },
      tiles: { spend: round4(spend), today: round4(todayCost), tokensIn: tokIn, tokensOut: tokOut, reasoning, requests,
        avgCostPerRequest: requests ? round4(spend / requests) : null, cacheHitRate: tokIn ? cached / tokIn : null, monthToDate, monthProjected },
      comparison,
      monthlyBudgetUsd: settings.monthlyBudgetUsd,
      daily,
      models: ranked(),
      keys: NEW ? [] : keysFor(range),
      mix: { cachedPrompt: cached, uncachedPrompt: Math.max(0, tokIn - cached), completion: tokOut, reasoning },
      heatmap,
      intraday: [],
      historyDays: HISTORY,
      stale: has('stale') ? { since: Date.now() - 3600e3, error: 'HTTP 503 from openrouter.ai (upstream timeout)' } : null
    };
  }

  const handlers = {
    'status.get': async () => ({
      configured, keyLabel: configured ? LABEL : null, refreshing: false,
      lastRefreshAt: Date.now() - 120e3,
      lastError: DOWN || (has('stale') ? 'HTTP 503 from openrouter.ai (upstream timeout)' : null)
    }),
    'keys.save': async (inp) => {
      if (!inp || !inp.mgmtKey) return { ok: false, error: 'Management key is required.' };
      if (inp.mgmtKey === 'bad') return { ok: false, error: 'OpenRouter rejected this management key (401 Unauthorized).' };
      configured = true;
      return { ok: true, label: LABEL };
    },
    'connection.test': async () => (configured ? { ok: true, label: LABEL } : { ok: false, error: 'Not connected. Save a management key first.' }),
    'keys.clear': async () => { configured = false; return { ok: true }; },
    'settings.get': async () => ({ ...settings }),
    'settings.set': async (inp) => { Object.assign(settings, clampSettings(inp || {})); return { ...settings }; },
    'report.get': async (inp) => (configured && !DOWN ? mockReport(inp.range, inp.measure) : null),
    'export.csv': async (inp) => {
      const rep = mockReport(inp.range, 'cost');
      const out = inp.kind === 'models' ? rep.models.map((m) => [m.name, m.cost]) : inp.kind === 'keys' ? rep.keys.map((k) => [keyName(k), k.spend]) : rep.daily.map((d) => [d.date, d.total]);
      const quote = (v) => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
      return { suggestedName: `openrouter-${inp.kind}-${inp.range}-${today}.csv`, mimeType: 'text/csv;charset=utf-8', data: [['name_or_date', 'spend_usd'], ...out].map((r) => r.map(quote).join(',')).join('\r\n') };
    },
    'refresh': async () => ({ ok: true })
  };

  const listeners = {};
  return {
    api: { major: 1, minor: 4 },
    locale: 'en-US',
    on(ev, fn) { (listeners[ev] = listeners[ev] || []).push(fn); return () => {}; },
    // Dev preview only: lets a test fire a worker event like a finished refresh would.
    emit(ev, payload) { (listeners[ev] || []).forEach((fn) => fn(payload)); },
    plugin: {
      async request(name, input) {
        await sleep(350);
        const h = handlers[name];
        if (!h) throw new Error('unknown_method: ' + name);
        return h(input || {});
      }
    },
    files: {
      async saveAs(options) {
        const url = URL.createObjectURL(new Blob([options.data], { type: options.mimeType }));
        const a = document.createElement('a'); a.href = url; a.download = options.suggestedName; a.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        return { status: 'saved' };
      }
    },
    shell: { async openExternal(url) { window.open(url, '_blank', 'noopener'); return { opened: true }; } }
  };
}

if (!window.orca || !window.orca.plugin) {
  window.orca = makeMock();
  // Preview states for screenshots: #pin=<days ago>, #model (select the top model), #scroll=<element id>.
  const h = location.hash;
  const pinAgo = (h.match(/(?:^#|,)pin=(\d+)/) || [])[1];
  const scrollTo = (h.match(/(?:^#|,)scroll=([a-z-]+)/) || [])[1];
  if (pinAgo || /(?:^#|,)model(?:,|$)/.test(h) || scrollTo) devHook = () => {
    if (pinAgo) pinDate(addDays(utcToday(), -+pinAgo));
    else if (/(?:^#|,)model(?:,|$)/.test(h) && state.report.models[0]) { state.model = state.report.models[0].name; render(); }
    const el = scrollTo && document.getElementById(scrollTo);
    if (el) el.scrollIntoView({ block: 'start' });
  };
}

/* ---------- start ---------- */

loadPrefs();
// #tab=keys selects a tab for this load only; it is not written to prefs.
const hashTab = (location.hash.match(/(?:^#|,)tab=([a-z]+)/) || [])[1];
if (TABS.some(([id]) => id === hashTab)) state.tab = hashTab;
host().on('report.changed', () => { if (state.status && state.status.configured) loadReport(true); });
host().on('status.changed', (s) => {
  state.status = s;
  if (!s.configured) { state.report = null; render(); return; }
  if (!state.report && !state.loading) loadReport(); else render();
});
host().on('theme', () => { if (state.tab === 'usage') { drawChart(); drawHeat(); } });
render();
refreshStatus().then(maybeAutoRefresh);
loadSettings();
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') maybeAutoRefresh(); });
})();
</script>
</body>
</html>
