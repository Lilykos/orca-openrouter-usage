<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src data:; base-uri 'none'; form-action 'none'">
<title>OpenRouter Usage</title>
<style>
/* Orca paints --orca-* and puts a light/dark class on <html>; the fallbacks are for the dev preview. */
:root {
  color-scheme: dark;
  --bg: var(--orca-background, #161616);
  --fg: var(--orca-foreground, #ececea);
  --fg-2: color-mix(in srgb, var(--fg) 72%, var(--bg));
  --muted: var(--orca-muted-foreground, #8a8a84);
  --border: var(--orca-border, #2a2a2a);
  --hair: color-mix(in srgb, var(--border) 75%, var(--bg));
  --hover: var(--orca-accent, #1f1f1f);
  --seg-bg: var(--orca-muted, #202020);
  --seg-on: color-mix(in srgb, var(--fg) 14%, var(--bg));
  --field: var(--orca-input-background, var(--bg));
  --primary: var(--orca-primary, #ececea);
  --primary-fg: var(--orca-primary-foreground, #161616);
  --danger: var(--orca-destructive, #f07c7b);
  --tip-bg: var(--orca-popover, #222222);
  --accent: #3987e5;
  --bar: #3987e5; --bar-soft: #27466b; --bar-today: #1c5cab; --ref: var(--fg);
  --h0: #232323; --h1: #1c3350; --h2: #1c5cab; --h3: #3987e5; --h4: #86b6ef;
  --warn: #f2b84b; --warn-mark: #c98500; --warn-bg: #261d0c; --warn-line: #4a3711;
  --danger-bg: #2b1515; --ok: #4cc38a; --neutral-bg: color-mix(in srgb, var(--fg) 9%, var(--bg));
  --focus: #5598e7;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.35);
  --bn-bg: radial-gradient(90% 120% at 100% 0%, rgba(124,108,242,.30) 0%, rgba(124,108,242,0) 65%), linear-gradient(135deg, #16152a 0%, #1e1a40 100%);
  --bn-line: rgba(255,255,255,.07); --bn-motif: #b9b0ff; --bn-fg: #ececea; --bn-fg-2: #c9c6e6;
  --bn-warn-bg: radial-gradient(90% 120% at 100% 0%, rgba(201,133,0,.26) 0%, rgba(201,133,0,0) 65%), linear-gradient(135deg, #1c160b 0%, #2b200d 100%);
  --bn-warn-line: rgba(242,184,75,.16); --bn-warn-motif: #f2b84b; --bn-btn: rgba(255,255,255,.06);
}
html.light {
  color-scheme: light;
  --bg: var(--orca-background, #ffffff);
  --fg: var(--orca-foreground, #18181a);
  --muted: var(--orca-muted-foreground, #7c7c76);
  --border: var(--orca-border, #e5e5e1);
  --hover: var(--orca-accent, #f3f3f0);
  --seg-bg: var(--orca-muted, #efefec);
  --seg-on: var(--bg);
  --primary: var(--orca-primary, #18181a);
  --primary-fg: var(--orca-primary-foreground, #ffffff);
  --danger: var(--orca-destructive, #c23a39);
  --tip-bg: var(--orca-popover, #ffffff);
  --accent: #2a78d6;
  --bar: #2a78d6; --bar-soft: #cde2fb; --bar-today: #86b6ef;
  --h0: #ededea; --h1: #cde2fb; --h2: #86b6ef; --h3: #3987e5; --h4: #1c5cab;
  --warn: #a35f00; --warn-mark: #eda100; --warn-bg: #fdf4e3; --warn-line: #f3dcae;
  --danger-bg: #fdeceb; --ok: #1b8a5a;
  --focus: #2a78d6;
  --shadow: 0 1px 2px rgba(0,0,0,.05), 0 8px 24px rgba(0,0,0,.08);
  --bn-bg: radial-gradient(90% 120% at 100% 0%, rgba(124,108,242,.16) 0%, rgba(124,108,242,0) 65%), linear-gradient(135deg, #f8f7ff 0%, #efedfe 100%);
  --bn-line: #e4e0fb; --bn-motif: #6d5fe0; --bn-fg: #18181a; --bn-fg-2: #51514c;
  --bn-warn-bg: radial-gradient(90% 120% at 100% 0%, rgba(237,161,0,.18) 0%, rgba(237,161,0,0) 65%), linear-gradient(135deg, #fffaf1 0%, #fcefd6 100%);
  --bn-warn-line: #f1dcae; --bn-warn-motif: #c98500; --bn-btn: rgba(255,255,255,.75);
}

* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); }
body { font: 13px/1.45 var(--orca-font-sans, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif); -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
p { margin: 0; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--muted); }

main { padding: 12px 14px 14px; max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; min-width: 0; }
main > * { min-width: 0; }
.busy { opacity: .6; transition: opacity .2s ease; }

/* ---------- controls ---------- */
.seg { display: inline-flex; background: var(--seg-bg); border-radius: 7px; padding: 2px; gap: 2px; flex: none; }
.seg button { border: 0; background: transparent; padding: 3px 10px; border-radius: 5px; font-size: 12px; color: var(--fg-2); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; min-height: 24px; }
.seg button:hover { color: var(--fg); }
.seg button[aria-selected="true"], .seg button[aria-checked="true"] { background: var(--seg-on); color: var(--fg); font-weight: 600; box-shadow: 0 0 0 1px var(--border); }
.seg.sm button { padding: 2px 7px; font-size: 11.5px; min-height: 22px; }
.dot-badge { width: 6px; height: 6px; border-radius: 50%; background: var(--warn-mark); }
.icon-btn { width: 28px; height: 28px; display: inline-grid; place-items: center; border: 0; background: transparent; border-radius: 6px; color: var(--muted); cursor: pointer; flex: none; padding: 0; }
.icon-btn:hover { background: var(--hover); color: var(--fg); }
.icon-btn:disabled { opacity: .6; cursor: default; }
.icon-btn.spin svg { animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.btn { display: inline-flex; align-items: center; gap: 5px; min-height: 26px; padding: 0 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--fg); font-size: 12px; font-weight: 500; cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--hover); }
.btn:disabled { opacity: .6; cursor: default; }
.btn.primary { background: var(--primary); color: var(--primary-fg); border-color: transparent; }
.btn.primary:hover { opacity: .9; background: var(--primary); }
.btn.danger { color: var(--danger); }
.btn.ghost { background: transparent; border-color: transparent; }
.link { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; font-size: 12px; display: inline-flex; gap: 4px; align-items: center; }
.link:hover { text-decoration: underline; }
.spinner { width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--border); border-top-color: var(--fg); display: inline-block; animation: spin .8s linear infinite; }

/* ---------- banner ---------- */
.banner { position: relative; overflow: hidden; border-radius: 10px; padding: 12px 14px 13px; background: var(--bn-bg); box-shadow: inset 0 0 0 1px var(--bn-line); color: var(--bn-fg); }
.banner.warn { background: var(--bn-warn-bg); box-shadow: inset 0 0 0 1px var(--bn-warn-line); }
.bn-motif { position: absolute; right: 0; top: 0; height: 100%; width: min(62%, 280px); color: var(--bn-motif); pointer-events: none;
  -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 55%); mask-image: linear-gradient(90deg, transparent 0%, #000 55%); }
.banner.warn .bn-motif { color: var(--bn-warn-motif); }
.banner > :not(.bn-motif) { position: relative; }
.bn-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 26px; }
.bn-label { font-size: 12px; color: var(--bn-fg-2); }
.hero-num { font-size: 38px; line-height: 1.1; font-weight: 600; letter-spacing: -0.02em; margin: 2px 0 4px; font-variant-numeric: tabular-nums; }
.hero-num .c { font-size: 26px; color: var(--bn-fg-2); font-weight: 500; }
.hero-sub { font-size: 12px; color: var(--bn-fg-2); }
.banner .btn { background: var(--bn-btn); border-color: var(--bn-line); color: var(--bn-fg); }
.banner.warn .btn { border-color: var(--bn-warn-line); }
.bn-skel { display: block; width: 150px; height: 38px; margin: 4px 0; border-radius: 8px; background: color-mix(in srgb, var(--bn-fg) 10%, transparent); animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .5; } }

/* ---------- warnings ---------- */
.warns { display: flex; flex-direction: column; gap: 6px; margin-top: -8px; }
.attn { display: flex; align-items: flex-start; gap: 8px; border: 1px solid var(--warn-line); background: var(--warn-bg); border-radius: 7px; padding: 7px 4px 7px 10px; font-size: 12.5px; }
.attn.danger { border-color: color-mix(in srgb, var(--danger) 35%, transparent); background: var(--danger-bg); }
.attn > svg { flex: none; color: var(--warn); margin-top: 2px; }
.attn.danger > svg { color: var(--danger); }
.attn .txt { flex: 1; min-width: 0; }
.attn .x { width: 22px; height: 22px; margin: -2px 0; }
.notice { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; border: 1px solid var(--border); background: var(--neutral-bg); border-radius: 7px; padding: 8px 10px; font-size: 12.5px; }
.notice.err { border-color: color-mix(in srgb, var(--danger) 35%, transparent); background: var(--danger-bg); }
.notice > span { flex: 1; min-width: 12em; }

/* ---------- top bar ---------- */
.p-top { display: flex; align-items: center; gap: 6px; }
.p-top .spacer { flex: 1; }
.menu-wrap { position: relative; }
.menu { position: absolute; right: 0; top: 32px; z-index: 5; min-width: 200px; background: var(--tip-bg); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow); padding: 4px; }
.menu button { display: flex; width: 100%; text-align: left; border: 0; background: transparent; padding: 6px 8px; border-radius: 5px; font-size: 12.5px; cursor: pointer; justify-content: space-between; gap: 12px; }
.menu button:hover, .menu button:focus-visible { background: var(--hover); }
.menu .k { color: var(--muted); font-size: 11.5px; }
.menu-msg { font-size: 12px; color: var(--muted); margin-top: -10px; }
.menu-msg.ok { color: var(--ok); }

/* ---------- sections ---------- */
.sec-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; min-width: 0; flex-wrap: wrap; }
.sec-h .ctl { display: flex; gap: 6px; }
h1 { font-size: 15px; margin: 0; font-weight: 600; }
h2 { font-size: 13px; font-weight: 600; margin: 0; white-space: nowrap; }
h2 .scope { font-weight: 400; color: var(--muted); }
.side { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.note-row { font-size: 12px; color: var(--muted); padding: 6px 0; margin: 0; }

.pair { display: grid; grid-template-columns: 1fr 1fr; border-bottom: 1px solid var(--hair); }
.pair > div { padding: 0 0 10px; min-width: 0; }
.pair > div + div { padding-left: 14px; border-left: 1px solid var(--hair); }
.pair .label { font-size: 12px; color: var(--fg-2); }
.pair .v { font-size: 17px; font-weight: 600; margin-top: 1px; font-variant-numeric: tabular-nums; }
.pair .s { font-size: 12px; color: var(--muted); }
.budget { margin-top: 10px; }
.meter { position: relative; height: 6px; border-radius: 3px; background: var(--hair); overflow: hidden; }
.meter i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; }
.meter .proj { background: var(--bar-soft); }
.meter .now { background: var(--bar); }
.meter .now.warn { background: var(--warn-mark); }
.budget .row { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); margin-top: 5px; }
.budget.over .row span:last-child { color: var(--warn); }

.readout { display: flex; align-items: baseline; gap: 8px; min-height: 24px; min-width: 0; }
.readout .v { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.readout .m { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.pin { margin-left: auto; border: 0; background: var(--neutral-bg); color: var(--fg-2); font-size: 11.5px; border-radius: 10px; padding: 1px 8px; cursor: pointer; white-space: nowrap; flex: none; }
.chart { display: block; width: 100%; height: 132px; margin-top: 4px; touch-action: pan-y; }
.chart .grid { stroke: var(--hair); stroke-width: 1; shape-rendering: crispEdges; }
.chart .tick, .heat .tick { font-size: 10px; fill: var(--muted); font-variant-numeric: tabular-nums; }
.chart .b-total { fill: var(--bar); }
.chart.sel .b-total { fill: var(--bar-soft); }
.chart .b-model { fill: var(--bar); }
.chart .b-today { fill: var(--bar-today); }
.chart.sel .b-today { fill: var(--bar-soft); }
.chart .hit { fill: transparent; cursor: pointer; outline: none; }
.chart .col.dim path { opacity: .35; }
.chart .hit:focus-visible { stroke: var(--focus); stroke-width: 1.5; }
.chart .ref { stroke: var(--ref); stroke-width: 1.5; stroke-linecap: round; }
.chart .ref-l { font-size: 10px; fill: var(--fg-2); font-weight: 600; }

/* models */
.mlist { list-style: none; margin: 4px 0 0; padding: 0; }
.mrow { display: grid; grid-template-columns: minmax(0, 1fr) auto 38px; column-gap: 10px; align-items: center; padding: 6px 6px 7px; margin: 0 -6px; width: calc(100% + 12px); border: 0; background: transparent; border-radius: 6px; text-align: left; font-size: 13px; }
button.mrow { cursor: pointer; }
button.mrow:hover { background: var(--hover); }
.mrow .n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mrow .vd { color: var(--muted); }
.mrow .val { font-variant-numeric: tabular-nums; font-weight: 500; text-align: right; white-space: nowrap; }
.mrow .pct { font-variant-numeric: tabular-nums; color: var(--muted); text-align: right; font-size: 12px; }
.mrow .bar { grid-column: 1 / -1; height: 2px; margin-top: 5px; background: var(--hair); border-radius: 1px; overflow: hidden; }
.mrow .bar i { display: block; height: 100%; background: var(--bar-soft); border-radius: 1px; }
.mrow[aria-expanded="true"] .bar i { background: var(--bar); }
.mrow[aria-expanded="true"] .n { font-weight: 600; }
.mrow.more .n { color: var(--fg-2); }
.mdetail { padding: 8px 0 12px; border-bottom: 1px solid var(--hair); margin-bottom: 4px; }
.kv { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px 12px; }
.kv div { min-width: 0; }
.kv .k { font-size: 11.5px; color: var(--muted); }
.kv .v { font-size: 13px; font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* token mix: four numbers */
.quad-top { display: flex; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
.quad-top b { color: var(--fg); font-weight: 600; }
.quad { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.quad > div { background: var(--hover); border-radius: 7px; padding: 7px 10px; min-width: 0; }
.quad .k { font-size: 11.5px; color: var(--muted); }
.quad .v { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
.quad .s { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* heatmap */
.heat { display: block; width: 100%; }
.heat .cell { cursor: pointer; outline: none; }
.heat .cell:focus-visible, .heat .cell.pinned { stroke: var(--fg); stroke-width: 1.5; }
.heat .cell.today { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 2 1.5; }
.heat-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; font-size: 11.5px; color: var(--muted); }
.scale { display: inline-flex; align-items: center; gap: 3px; }
.scale i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }

/* keys */
.klist { list-style: none; margin: 0; padding: 0; }
.krow { padding: 10px 0; border-top: 1px solid var(--hair); }
.krow:first-child { border-top: 0; padding-top: 4px; }
.k1 { display: flex; align-items: center; gap: 8px; min-width: 0; }
.k1 .n { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.k1 .v { margin-left: auto; font-weight: 500; font-variant-numeric: tabular-nums; }
.k2 { font-size: 12px; color: var(--muted); margin-top: 2px; display: flex; gap: 8px; justify-content: space-between; flex-wrap: wrap; }
.badge { font-size: 11px; font-weight: 500; padding: 0 6px; border-radius: 4px; line-height: 18px; white-space: nowrap; flex: none; }
.badge.warn { color: var(--warn); background: var(--warn-bg); }
.badge.danger { color: var(--danger); background: var(--danger-bg); }
.badge.neutral { color: var(--fg-2); background: var(--neutral-bg); }
.kmeter { margin-top: 7px; }
.kmeter .meter { height: 4px; }
.inactive { width: 100%; border: 0; border-top: 1px solid var(--hair); background: transparent; text-align: left; padding: 10px 0 2px; color: var(--fg-2); font-size: 12.5px; cursor: pointer; display: flex; justify-content: space-between; }
.inactive .n { color: var(--fg-2); }

/* settings */
.conn { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: center; padding: 6px 0 10px; }
.conn .ic { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--neutral-bg); color: var(--ok); }
.conn .who { min-width: 0; }
.conn .who b { font: 600 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere; }
.conn .who div { font-size: 12px; color: var(--muted); }
.conn-acts { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 0 10px; align-items: center; }
.conn-res { font-size: 12px; margin: 0 0 8px; }
.ok-t { color: var(--ok); }
.err-t { color: var(--danger); }
.confirm { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 12px; color: var(--fg-2); }
.keyform { display: flex; flex-direction: column; gap: 8px; padding: 2px 0 10px; }
.keyform input { height: 30px; border: 1px solid var(--border); border-radius: 6px; background: var(--field); padding: 0 8px; font-size: 13px; width: 100%; }
.keyform .acts { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.keyform .msg { font-size: 12px; min-height: 1em; }
.srow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 9px 0; border-top: 1px solid var(--hair); }
.srow .t { font-size: 13px; }
.srow .d { font-size: 12px; color: var(--muted); }
.srow.dis { opacity: .5; }
.num { display: inline-flex; align-items: center; height: 26px; border: 1px solid var(--border); border-radius: 6px; background: var(--field); padding: 0 8px; gap: 3px; color: var(--muted); font-size: 12px; }
.num:focus-within { outline: 2px solid var(--focus); outline-offset: 1px; }
.num input { width: 52px; border: 0; background: transparent; outline: none; text-align: right; font-size: 13px; color: var(--fg); font-variant-numeric: tabular-nums; padding: 0; -moz-appearance: textfield; }
.num input::-webkit-outer-spin-button, .num input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.select { height: 26px; border: 1px solid var(--border); border-radius: 6px; background: var(--field); font-size: 12.5px; padding: 0 6px; max-width: 190px; }
.switch { appearance: none; -webkit-appearance: none; width: 32px; height: 18px; border-radius: 9px; background: var(--border); position: relative; cursor: pointer; flex: none; margin: 0; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: left .15s ease; }
.switch:checked { background: var(--accent); }
.switch:checked::after { left: 16px; }
.saved { font-size: 12px; color: var(--ok); }
.fine { font-size: 12px; color: var(--muted); }
.fine + .fine { margin-top: 6px; }

.setup h1 { margin-bottom: 6px; }
.setup p { color: var(--muted); font-size: 12.5px; margin-bottom: 10px; }
.skel { border-radius: 8px; background: var(--neutral-bg); animation: pulse 1.4s ease-in-out infinite; }
.p-foot { font-size: 11.5px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; border-top: 1px solid var(--hair); padding-top: 10px; }

@media (max-width: 440px) {
  .hero-num { font-size: 34px; }
  .kv { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>
<main id="app" aria-live="off"></main>
<script>
(() => {
'use strict';

const KEYS_URL = 'https://openrouter.ai/settings/management-keys';
const CREDITS_URL = 'https://openrouter.ai/settings/credits';
const PREF_KEY = 'openrouter-usage:prefs';
const DISMISS_KEY = 'openrouter-usage:dismissed';
const TABS = [['usage', 'Usage'], ['keys', 'Keys'], ['settings', 'Settings']];
const RANGES = [['7d', '7D'], ['30d', '30D'], ['all', 'All']];
const MEASURES = [['cost', 'Cost'], ['tokens', 'Tokens']];
const RANGE_DAYS = { '7d': 7, '30d': 30 };
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

/* ---------- helpers ---------- */

const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const groupInt = (s) => String(s).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
const errMsg = (e) => (e && e.message) || String(e);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const round2 = (v) => Math.round(v * 100) / 100;
const round4 = (v) => Math.round(v * 10000) / 10000;
const TOK = () => state.measure === 'tokens';

function money(v) {
  if (v == null || !isFinite(v)) return '—';
  const a = Math.abs(v);
  const sign = v < 0 ? '-' : '';
  if (a !== 0 && a < 0.01) return sign + '$' + a.toFixed(a < 0.001 ? 4 : 3);
  const [i, f] = a.toFixed(2).split('.');
  return sign + '$' + groupInt(i) + '.' + f;
}
function compact(n) {
  if (n == null || !isFinite(n)) return '—';
  const a = Math.abs(n);
  const sign = n < 0 ? '-' : '';
  const f = (x, u) => sign + (x >= 100 ? String(Math.round(x)) : x.toFixed(1).replace(/\.0$/, '')) + u;
  if (a >= 1e9) return f(a / 1e9, 'B');
  if (a >= 1e6) return f(a / 1e6, 'M');
  if (a >= 1e3) return f(a / 1e3, 'K');
  return sign + Math.round(a);
}
// Shares: whole percents, one decimal under 10%, "<1%" for slivers.
const pct = (v) => (v == null || !isFinite(v) ? '—' : v >= 0.995 ? '100%' : v >= 0.095 ? Math.round(v * 100) + '%' : v >= 0.005 ? (v * 100).toFixed(1).replace(/\.0$/, '') + '%' : v > 0 ? '<1%' : '0%');
const fmtV = (v) => (TOK() ? compact(v) : money(v));
const splitName = (id) => { const s = String(id == null ? '' : id); const i = s.indexOf('/'); return i < 0 ? ['', s] : [s.slice(0, i + 1), s.slice(i + 1)]; };

const utcToday = () => new Date().toISOString().slice(0, 10);
function addDays(d, n) {
  const x = new Date(d + 'T00:00:00Z');
  x.setUTCDate(x.getUTCDate() + n);
  return x.toISOString().slice(0, 10);
}
const weekday = (d) => new Date(d + 'T00:00:00Z').getUTCDay();
const dShort = (d) => MONTHS[+d.slice(5, 7) - 1] + ' ' + (+d.slice(8, 10));
const dLong = (d) => WD[weekday(d)] + ', ' + dShort(d);
const weekStart = (d) => addDays(d, -((weekday(d) + 6) % 7));
function relTime(ts) {
  const t = typeof ts === 'string' ? Date.parse(ts) : ts;
  if (!isFinite(t)) return '—';
  const s = Math.max(0, (Date.now() - t) / 1000);
  if (s < 45) return 'just now';
  if (s < 3600) return Math.floor(s / 60) + ' min ago';
  if (s < 86400) return Math.floor(s / 3600) + ' h ago';
  if (s < 2 * 86400) return 'yesterday';
  if (s < 2592000) return Math.floor(s / 86400) + ' d ago';
  return dShort(new Date(t).toISOString().slice(0, 10));
}
const absTime = (t) => new Date(t).toLocaleString();
const utcDayStartLocal = () => new Date(Date.parse(utcToday() + 'T00:00:00Z')).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

function niceStep(max) {
  const raw = max / 3, mag = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / mag;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * mag;
}

    if (RANGES.some(([v]) => v === p.keysRange)) state.keysRange = p.keysRange;

}

/* ---------- derived data ---------- */

const lowOf = () => (state.settings && state.settings.lowBalanceUsd) || 0;
// Runway is short: 3 days or less at the recent rate, or credits under the low-balance alert.
function runwayShort(rep) {
  const b = rep.balance;
  return (b.daysLeft != null && b.daysLeft <= 3) || (lowOf() > 0 && b.remaining < lowOf());
}
const keyName = (k) => k.name || k.label || String(k.hash || '').slice(0, 8) || 'Unnamed key';
const keySpend = (k, range) => (k.spendByRange ? k.spendByRange[range] : k.spend);
const RESET = { daily: 'daily', weekly: 'weekly', monthly: 'monthly' };

// One warning per thing worth acting on. Ids carry what makes them new again (a date, a key, a month).
function warnings(rep) {
  const out = [];
  const today = utcToday();
  const b = rep.balance;
  if (runwayShort(rep)) {
    let text;
    if (b.daysLeft != null && b.burnPerDay) {
      const n = Math.round(b.daysLeft);
      const end = addDays(today, Math.max(0, Math.round(b.daysLeft)));
      text = b.daysLeft < 1 ? `Credits run out <b>today</b> at your recent rate` : `About <b>${n} day${n === 1 ? '' : 's'} left</b>, until around ${esc(dLong(end))}`;
    } else text = `Credits are below your ${esc(money(lowOf()))} alert`;
    out.push({ id: 'runway:' + today, tone: b.daysLeft != null && b.daysLeft < 1 ? 'danger' : 'warn', html: text });
  }
  for (const k of rep.keys || []) {
    if (k.disabled) continue;
    const h = k.health || {};
    const n = `<b>${esc(keyName(k))}</b>`;
    if (h.limit === 'exhausted') out.push({ id: `key:${k.hash}:exhausted`, tone: 'danger', html: `${n} has reached its ${esc(money(k.limit))}${k.limitReset ? ' ' + RESET[k.limitReset] : ''} limit` });
    else if (h.limit === 'near') out.push({ id: `key:${k.hash}:near`, tone: 'warn', html: `${n} has used ${pct(h.usedFraction)} of its ${esc(money(k.limit))}${k.limitReset ? ' ' + RESET[k.limitReset] : ''} limit` });
    if (h.expiry === 'expiring' && k.expiresAt) out.push({ id: `key:${k.hash}:expiring`, tone: 'warn', html: `${n} expires ${esc(dLong(k.expiresAt.slice(0, 10)))}` });
    else if (h.expiry === 'expired') out.push({ id: `key:${k.hash}:expired`, tone: 'danger', html: `${n} has expired` });
  }
  const budget = rep.monthlyBudgetUsd;
  const t = rep.tiles;
  if (budget > 0 && (t.monthToDate > budget || (t.monthProjected != null && t.monthProjected > budget))) {
    const month = MONTHS_LONG[+today.slice(5, 7) - 1];
    out.push({ id: 'budget:' + today.slice(0, 7), tone: 'warn', html: t.monthToDate > budget
      ? `${month} spend ${esc(money(t.monthToDate))} is over your ${esc(money(budget))} budget`
      : `${month} is on pace for ${esc(money(t.monthProjected))}, over your ${esc(money(budget))} budget` });
  }
  return out.filter((w) => !dismissed.has(w.id));
}

// Chart buckets: one per day, or one per week when All holds a long history.
function buckets(rep) {
  const days = rep.daily;
  if (!(rep.range === 'all' && days.length > WEEKLY_AFTER)) return days.map((d) => ({ from: d.date, to: d.date, total: d.total, byModel: d.byModel, partial: d.partial, week: false }));
  const out = [];
  for (const d of days) {
    const ws = weekStart(d.date);
    let b = out[out.length - 1];
    if (!b || b.from !== ws) { b = { from: ws, to: d.date, total: 0, byModel: {}, partial: false, week: true }; out.push(b); }
    b.to = d.date;
    b.total += d.total;
    for (const m in d.byModel) b.byModel[m] = (b.byModel[m] || 0) + d.byModel[m];
    if (d.partial) b.partial = true;
  }
  return out;
}

// The days a date range covers, merged into one: total, models, mix.
function aggregate(rep, r) {
  const ds = rep.daily.filter((d) => d.date >= r.from && d.date <= r.to);
  const out = { from: r.from, to: r.to, total: 0, byModel: {}, mix: { cachedPrompt: 0, uncachedPrompt: 0, completion: 0, reasoning: 0 }, partial: false, days: ds.length };
  for (const d of ds) {
    out.total += d.total;
    for (const m in d.byModel) out.byModel[m] = (out.byModel[m] || 0) + d.byModel[m];
    for (const k in out.mix) out.mix[k] += (d.mix && d.mix[k]) || 0;
    if (d.partial) out.partial = true;
  }
  out.todayOnly = out.partial && ds.length === 1;
  return out;
}
const focusRange = () => state.pin || state.hover;
const rangeLabel = (r) => (r.from === r.to ? dLong(r.from) : 'Week of ' + dShort(r.from));
const scopeLabel = (rep) => {
  const f = focusRange();
  if (f) return f.from === f.to ? dShort(f.from) : 'week of ' + dShort(f.from);
  return rep.range === 'all' ? 'all time' : 'last ' + RANGE_DAYS[rep.range] + ' days';
};

function todayMonthHtml(rep) {
  const t = rep.tiles;
  const month = MONTHS_LONG[+utcToday().slice(5, 7) - 1];
  const budget = rep.monthlyBudgetUsd;
  let meter = '';

    const proj = t.monthProjected;
