  </div>`;
}

/* ---------- events ---------- */

const app = $('#app');

app.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const v = el.dataset.val;
  switch (el.dataset.act) {
    case 'tab':
      if (state.tab !== v) selectTab(v);
      break;
    case 'range':
      if (state.range !== v) { state.range = v; savePrefs(); loadReport(); }
      break;
    case 'measure':
      if (state.measure !== v) { state.measure = v; savePrefs(); loadReport(); }
      break;
    case 'model-open':
      openDrawer(v);
      break;
    case 'drawer-close':
      closeDrawer();
      break;
    case 'models-more':
      state.modelsAll = !state.modelsAll;
      render();
      break;
    case 'refresh':
      doRefresh();
      break;
    case 'conn-test':
      testConnection();
      break;
    case 'retry':
      if (!state.status) refreshStatus(); else loadReport();
      break;
    case 'go-settings':
      selectTab('settings');
      break;
    case 'dismiss-notice':
      state.notice = '';
      render();
      break;
    case 'open-keys':
      Promise.resolve(host().shell.openExternal(KEYS_URL)).catch(() => {});
      break;
    case 'save-keys':
      saveKeys();
      break;
    case 'disconnect-ask':
      state.confirmDisc = true;
      render();
      { const y = $('[data-fk="disconnect-yes"]'); if (y) y.focus(); }
      break;
    case 'disconnect-no':
      state.confirmDisc = false;
      render();
      break;
    case 'disconnect-yes':
      disconnect();
      break;
    default:
      break;
  }
});

// Settings controls save on change (blur or Enter for number inputs), never per keystroke.
app.addEventListener('change', (e) => {
  const el = e.target;
  const field = el.dataset && el.dataset.set;
  if (!field) return;
  if (el.type === 'checkbox') { saveSetting(field, el.checked); return; }
  if (el.tagName === 'SELECT') { if (state.settings && el.value !== state.settings[field]) saveSetting(field, el.value); return; }
  const cur = state.settings ? state.settings[field] : '';
  const n = Number(el.value);
  const min = el.min === '' ? -Infinity : +el.min;
  const max = el.max === '' ? Infinity : +el.max;
  if (el.value === '' || !isFinite(n) || n < min || n > max) {
    el.value = cur;
    return;
  }
  if (n === cur) return;
  saveSetting(field, n);
});

app.addEventListener('keydown', (e) => {
  const t = e.target;
  if (e.key === 'Enter' && t.tagName === 'INPUT') {
    if (t.closest('.keyform')) { e.preventDefault(); saveKeys(); return; }
    if (t.dataset.set && t.type === 'number') { e.preventDefault(); t.blur(); return; }
  }
  const seg = t.closest && t.closest('.seg, .tabs');
  if (seg && /^Arrow/.test(e.key)) {
    e.preventDefault();
    const btns = [...seg.querySelectorAll('button')];
    const i = btns.indexOf(t);
    const d = e.key === 'ArrowRight' || e.key === 'ArrowDown' ? 1 : -1;
    const nb = btns[(i + d + btns.length) % btns.length];
    nb.focus();
    nb.click();
  }
});

app.addEventListener('mouseover', (e) => {
  const el = e.target.closest && e.target.closest('[data-tip]');
  if (el) showTip(el);
});
app.addEventListener('mouseout', (e) => {
  const el = e.target.closest && e.target.closest('[data-tip]');
  if (el && !el.contains(e.relatedTarget)) hideTip();
});
app.addEventListener('focusin', (e) => {
  const el = e.target.closest && e.target.closest('[data-tip]');
  if (el) showTip(el);
});
app.addEventListener('focusout', hideTip);

document.addEventListener('keydown', (e) => {
  if (state.drawer) {
    if (e.key === 'Escape') { e.preventDefault(); hideTip(); closeDrawer(); return; }
    if (e.key === 'Tab') trapTab(e);
    return;
  }
  if (e.key === 'Escape') hideTip();
});

window.addEventListener('scroll', hideTip, true);

let lastW = window.innerWidth;
let rzFrame = 0;
window.addEventListener('resize', () => {
  cancelAnimationFrame(rzFrame);
  rzFrame = requestAnimationFrame(() => {
    if (Math.abs(window.innerWidth - lastW) > 8) { lastW = window.innerWidth; render(); }
  });
});

setInterval(() => {
  document.querySelectorAll('[data-rel]').forEach((el) => {
    el.textContent = (el.dataset.prefix || '') + relTime(+el.dataset.rel);
  });
}, 30000);

/* ---------- dev preview mock (only when no Orca host) ---------- */

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function makeMock() {
  const flags = location.hash.slice(1).split(',').filter(Boolean);
  const has = (f) => flags.includes(f);
  if (has('light') || (!has('dark') && window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches)) {
    document.documentElement.classList.add('light');
  }
  const rnd = mulberry32(20261110);
  const today = utcToday();
  const HISTORY = 60;
  const TOTAL_CREDITS = 85;
  const LABEL = 'sk-or-v1-abc...xyz';
  const MODELS = [
    { name: 'anthropic/claude-sonnet-4.5', provider: 'Anthropic', w: 0.32, ppm: 3.0, reason: 0.3 },
    { name: 'openai/gpt-5-mini', provider: 'OpenAI', w: 0.22, ppm: 0.25, reason: 0.4 },
    { name: 'google/gemini-2.5-flash', provider: 'Google', w: 0.18, ppm: 0.3, reason: 0.2 },
    { name: 'google/gemini-2.5-pro', provider: 'Google', w: 0.1, ppm: 1.25, reason: 0.5 },
    { name: 'deepseek/deepseek-chat', provider: 'Together', w: 0.1, ppm: 0.4, reason: 0 },
    { name: 'meta-llama/llama-3.3-70b-instruct', provider: 'Together', w: 0.08, ppm: 0.3, reason: 0 }
  ];
  const rows = [];
  for (let i = 0; i <= HISTORY; i++) {
    const date = addDays(today, -i);
    const weekend = [0, 6].includes(weekday(date));
    const partial = i === 0;
    const day = (0.6 + 0.8 * rnd()) * (weekend ? 0.6 : 1) * (partial ? 0.45 : 1);
    MODELS.forEach((m) => {
      const cost = round4(day * m.w * (0.7 + 0.6 * rnd()));
      if (cost <= 0) return;
      const tok = (cost / m.ppm) * 1e6;
      const prompt = Math.round(tok * 0.8);
      const completion = Math.round(tok * 0.2);
      rows.push({
        date, model: m.name, provider: m.provider, endpoint: m.provider.toLowerCase() + '/main',
        usage: cost, byokUsage: rnd() < 0.12 ? round4(cost * 0.25) : 0,
        requests: Math.max(1, Math.round(cost / (0.003 + m.ppm * 0.0009))),
        prompt, completion, reasoning: Math.round(completion * m.reason),
        cached: Math.round(prompt * (0.2 + 0.4 * rnd()))
      });
    });
  }
  const totalUsage = rows.reduce((a, r) => a + r.usage + r.byokUsage, 0);
  const hex = (n) => Array.from({ length: n }, () => Math.floor(rnd() * 16).toString(16)).join('');
  const KEYS = [
    { name: 'prod-api', label: 'sk-or-v1-…a41f', limit: 50, usage: 18.8, d: 1.2, w: 6.4, m: 16.2, s7: 6.4, s30: 16.2, sAll: 18.8, agoMin: 7, disabled: false },
    { name: '', label: 'sk-or-v1-…9c02', limit: null, usage: 3.1, d: 0, w: 0.4, m: 1.7, s7: 0.4, s30: 1.7, sAll: 3.1, agoMin: 95, disabled: false },
    { name: 'n8n automations', label: '', limit: 20, usage: 17.1, d: 0.7, w: 3.9, m: 9.6, s7: 3.9, s30: 9.6, sAll: 17.1, agoMin: 180, disabled: false },
    { name: 'staging', label: '', limit: 10, usage: 0.4, d: 0, w: 0, m: 0.4, s7: 0, s30: 0.4, sAll: 0.4, agoMin: 5760, disabled: true },
    { name: 'laptop-cli', label: '', limit: null, usage: 5.6, d: 0.3, w: 1.9, m: 4.7, s7: 1.9, s30: 4.7, sAll: 5.6, agoMin: 30, disabled: false },
    { name: 'ci-bot', label: '', limit: null, usage: 0, d: 0, w: 0, m: 0, s7: 0, s30: 0, sAll: 0, agoMin: 2880, disabled: false },
    { name: 'old-experiments', label: '', limit: 25, usage: 0, d: 0, w: 0, m: 0, s7: 0, s30: 0, sAll: 0, agoMin: null, disabled: false }
  ].map((k) => ({ ...k, hash: hex(64) }));
  const keysFor = (range) => KEYS.map((k) => ({
    hash: k.hash, name: k.name, label: k.label, disabled: k.disabled, limit: k.limit,
    limitRemaining: k.limit == null ? null : Math.max(0, round2(k.limit - k.usage)),
    usage: k.usage, usageDaily: k.d, usageWeekly: k.w, usageMonthly: k.m,
    lastUsedAt: k.agoMin == null ? null : new Date(Date.now() - k.agoMin * 60e3).toISOString(),
    spend: range === '7d' ? k.s7 : range === '30d' ? k.s30 : k.sAll
  }));
  // #new: a brand-new account (no activity, no keys, zero credits). #offline / #revoked: report unavailable, status carries the error.
  const NEW = has('new');
  const DOWN = has('offline') ? "Can't reach OpenRouter. Check your internet connection." : has('revoked') ? 'OpenRouter rejected this key. It may be mistyped or revoked.' : null;
  let configured = !has('setup');
  const settings = { refreshMinutes: 15, lowBalanceUsd: 10, dailyBudgetUsd: 0, notifications: true, statusBar: true, statusBarContent: 'credits-today', includeByok: true };
  const clampSettings = (p) => {
    const out = {};
    if ('refreshMinutes' in p) out.refreshMinutes = Math.min(120, Math.max(1, Math.round(+p.refreshMinutes) || 1));
    if ('lowBalanceUsd' in p) out.lowBalanceUsd = Math.max(0, +p.lowBalanceUsd || 0);
    if ('dailyBudgetUsd' in p) out.dailyBudgetUsd = Math.max(0, +p.dailyBudgetUsd || 0);
    if ('statusBarContent' in p && SBC.some(([v]) => v === p.statusBarContent)) out.statusBarContent = p.statusBarContent;
    ['notifications', 'statusBar', 'includeByok'].forEach((k) => { if (k in p) out[k] = !!p[k]; });
    return out;
  };

  function mockReport(range, measure) {
    const span = range === '7d' ? 7 : range === '30d' ? 30 : HISTORY + 1;
    const dates = [];
    for (let i = span - 1; i >= 0; i--) dates.push(addDays(today, -i));
    const dset = new Set(dates);
    const cost = (r) => r.usage + (settings.includeByok ? r.byokUsage : 0);
    const val = (r) => (measure === 'tokens' ? r.prompt + r.completion : cost(r));
    const rowsR = has('empty') || NEW ? [] : rows.filter((r) => dset.has(r.date));
    const sum = (arr, f) => arr.reduce((a, r) => a + f(r), 0);
    const spend = sum(rowsR, cost);
    const tokIn = sum(rowsR, (r) => r.prompt);
    const tokOut = sum(rowsR, (r) => r.completion);
    const cached = sum(rowsR, (r) => r.cached);
    const reasoning = sum(rowsR, (r) => r.reasoning);
    const requests = sum(rowsR, (r) => r.requests);
    const todayCost = sum(rowsR.filter((r) => r.date === today), cost);

    const modelTot = {};
    rowsR.forEach((r) => { modelTot[r.model] = (modelTot[r.model] || 0) + val(r); });
    const top = Object.keys(modelTot).sort((a, b) => modelTot[b] - modelTot[a]).slice(0, 5);
    const daily = dates.map((date) => {
      const byModel = {};
      let total = 0;
      rowsR.filter((r) => r.date === date).forEach((r) => {
        const k = top.includes(r.model) ? r.model : 'other';
        byModel[k] = (byModel[k] || 0) + val(r);
        total += val(r);
      });
      return { date, total: round4(total), byModel, partial: date === today };
    });

    const nonPartial = dates.filter((d) => d !== today);
    const seriesFor = (name) => nonPartial.map((date) =>
      round4(rowsR.filter((r) => r.date === date && r.model === name).reduce((a, r) => a + val(r), 0)));
    const ranked = () => {
      const m = {};
      rowsR.forEach((r) => {
        const o = m[r.model] || (m[r.model] = { name: r.model, cost: 0, requests: 0, prompt: 0, completion: 0, reasoning: 0, cached: 0 });
        o.cost += cost(r); o.requests += r.requests; o.prompt += r.prompt; o.completion += r.completion;
        o.reasoning += r.reasoning; o.cached += r.cached;
      });
      return Object.values(m).map((o) => {
        const tok = o.prompt + o.completion;
        return { ...o, cost: round4(o.cost), costPerMTok: tok ? round4((o.cost / tok) * 1e6) : null, series: seriesFor(o.name) };
      }).sort((a, b) => (measure === 'tokens' ? b.prompt + b.completion - (a.prompt + a.completion) : b.cost - a.cost));
    };

    const costBy = {};
    rows.forEach((r) => { costBy[r.date] = (costBy[r.date] || 0) + r.usage + r.byokUsage; });
    const heatmap = [];
    for (let i = 181; i >= 0; i--) {
      const d = addDays(today, -i);
      heatmap.push({ date: d, cost: NEW ? 0 : round4(costBy[d] || 0) });
    }

    const yest = [1, 2, 3, 4, 5, 6, 7].map((i) => addDays(today, -i));
    const burnTotal = NEW ? 0 : rows.filter((r) => yest.includes(r.date)).reduce((a, r) => a + r.usage + r.byokUsage, 0);
    const burnPerDay = burnTotal > 0 ? round4(burnTotal / 7) : null;
    // #low: put the balance under the alert threshold (warning tone).
    const remaining = NEW ? 0 : has('low') ? round2(Math.max(1, settings.lowBalanceUsd) * 0.7) : round2(TOTAL_CREDITS - totalUsage);
    const daysLeft = burnPerDay ? round2(remaining / burnPerDay) : null;

    const mNow = Date.now();
    const midnight = Date.parse(today + 'T00:00:00Z');
    const steps = Math.max(2, Math.floor((mNow - midnight) / (90 * 60e3)));
    const intraday = has('empty') || NEW ? [] : Array.from({ length: steps + 1 }, (_, i) => ({
      t: Math.round(midnight + (i * (mNow - midnight)) / steps),
      remaining: round2(remaining + 0.6 - (i * 0.6) / steps + (i % 2 ? 0.02 : 0))
    }));

    return {
      generatedAt: Date.now(),
      range, measure,
      balance: { remaining, burnPerDay, daysLeft },
      tiles: {
        spend: round4(spend), today: round4(todayCost), tokensIn: tokIn, tokensOut: tokOut, reasoning, requests,
        avgCostPerRequest: requests ? round4(spend / requests) : null,
        cacheHitRate: tokIn ? cached / tokIn : null
      },
      daily,
      models: ranked(),
      keys: NEW ? [] : keysFor(range),
      mix: { cachedPrompt: cached, uncachedPrompt: Math.max(0, tokIn - cached), completion: tokOut, reasoning },
      heatmap,
      intraday,
      historyDays: HISTORY,
      stale: has('stale') ? { since: Date.now() - 3600e3, error: 'HTTP 503 from openrouter.ai (upstream timeout)' } : null
    };
  }

  const handlers = {
    'status.get': async () => ({
      configured,
      keyLabel: configured ? LABEL : null,
      refreshing: false,
      lastRefreshAt: Date.now() - 120e3,
      lastError: DOWN || (has('stale') ? 'HTTP 503 from openrouter.ai (upstream timeout)' : null)
    }),
    'keys.save': async (inp) => {
      if (!inp || !inp.mgmtKey) return { ok: false, error: 'Management key is required.' };
      if (inp.mgmtKey === 'bad') return { ok: false, error: 'OpenRouter rejected this management key (401 Unauthorized).' };
      configured = true;
      return { ok: true, label: LABEL };
    },
    'connection.test': async () => (configured
      ? { ok: true, label: LABEL }
      : { ok: false, error: 'Not connected. Save a management key first.' }),
    'keys.clear': async () => { configured = false; return { ok: true }; },
    'settings.get': async () => ({ ...settings }),
    'settings.set': async (inp) => { Object.assign(settings, clampSettings(inp || {})); return { ...settings }; },
    'report.get': async (inp) => (configured && !DOWN ? mockReport(inp.range, inp.measure) : null),
    'refresh': async () => ({ ok: true })
  };

  const listeners = {};
  return {
    api: { major: 1, minor: 4 },
    locale: 'en-US',
    on(ev, fn) { (listeners[ev] = listeners[ev] || []).push(fn); return () => {}; },
    // Dev preview only: lets a test fire a worker event (e.g. report.changed) like a finished refresh would.
    emit(ev, payload) { (listeners[ev] || []).forEach((fn) => fn(payload)); },
    plugin: {
      async request(name, input) {
        await sleep(350);
        const h = handlers[name];
        if (!h) throw new Error('unknown_method: ' + name);
        return h(input || {});
      }
    },
    shell: {
      async openExternal(url) { window.open(url, '_blank', 'noopener'); return { opened: true }; }
    }
  };
}

if (!window.orca || !window.orca.plugin) window.orca = makeMock();

/* ---------- start ---------- */

loadPrefs();
// #tab=keys (any tab id) selects a tab for this load only; it is not written to prefs.
const hashTab = (location.hash.match(/(?:^#|,)tab=([a-z]+)/) || [])[1];
if (TABS.some(([id]) => id === hashTab)) state.tab = hashTab;
state.pendingDrawer = location.hash.includes('drawer');
if (state.pendingDrawer) state.tab = 'models';
host().on('report.changed', () => { if (state.status && state.status.configured) loadReport(); });
host().on('status.changed', (s) => {
  state.status = s;
  if (!s.configured) { state.report = null; render(); return; }
  if (!state.report && !state.loading) loadReport(); else render();
});
render();
refreshStatus().then(maybeAutoRefresh);
loadSettings();
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') maybeAutoRefresh(); });
})();
</script>
</body>
</html>
