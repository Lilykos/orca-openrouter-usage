<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src data:; base-uri 'none'; form-action 'none'">
<title>OpenRouter Usage</title>
<style>
:root {
  --bg: var(--orca-background, #111111);
  --fg: var(--orca-foreground, #ececec);
  --card: var(--orca-card, #181818);
  --muted-fg: var(--orca-muted-foreground, #9a9a9a);
  --muted: var(--orca-muted, #262626);
  --border: var(--orca-border, #2a2a2a);
  --accent: var(--orca-accent, #262626);
  --primary: var(--orca-primary, #ececec);
  --radius: var(--orca-radius, 10px);
  --destructive: var(--orca-destructive, #e34948);
  /* categorical slots (validated: adjacent CVD ΔE >= 8.4) */
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --m0: #3987e5; --m1: #d95926; --m2: #199e70; --m3: #c98500; --m4: #9b6bd6; --m5: #d2507a;
  --m-other: #6f6f6f;
  /* sequential blue, dark steps */
  --q1: #184f95; --q2: #256abf; --q3: #3987e5; --q4: #86b6ef;
  color-scheme: dark;
}
html.light {
  --bg: var(--orca-background, #ffffff);
  --fg: var(--orca-foreground, #141414);
  --card: var(--orca-card, #fcfcfb);
  --muted-fg: var(--orca-muted-foreground, #6b6b6b);
  --muted: var(--orca-muted, #eeeeec);
  --border: var(--orca-border, #e3e3e0);
  --accent: var(--orca-accent, #f0f0ee);
  --primary: var(--orca-primary, #141414);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --m0: #2a78d6; --m1: #eb6834; --m2: #1baf7a; --m3: #eda100; --m4: #8a57c4; --m5: #d4467a;
  --m-other: #b5b5b5;
  --q1: #b7d3f6; --q2: #6da7ec; --q3: #2a78d6; --q4: #184f95;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); }
body { font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
h1, h2, h3 { margin: 0; font-weight: 600; }
h1 { font-size: 16px; }
h2 { font-size: 13px; }
h3 { font-size: 12px; color: var(--muted-fg); margin-bottom: 6px; }
p { margin: 0; }
button { font: inherit; color: inherit; }
.muted { color: var(--muted-fg); }
.small { font-size: 12px; }
.ok { color: var(--s3); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.sw { display: inline-block; width: 9px; height: 9px; border-radius: 50%; flex: none; }

main { padding: 16px; max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
main > * { min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; transition: opacity .2s ease; }
.stack.busy { opacity: .55; }

:focus-visible { outline: 2px solid var(--s1); outline-offset: 1px; }

/* buttons */
.btn { display: inline-flex; align-items: center; gap: 6px; min-height: 30px; padding: 4px 11px; border: 1px solid var(--border); background: var(--card); color: var(--fg); border-radius: 8px; cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--accent); }
.btn:disabled { opacity: .6; cursor: default; }
.btn.primary { background: var(--primary); color: var(--orca-primary-foreground, var(--bg)); border-color: transparent; }
.btn.primary:hover { opacity: .9; }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--destructive); }
.link { background: none; border: 0; padding: 0; color: var(--s1); text-decoration: underline; cursor: pointer; font: inherit; }
.icon-btn { display: inline-grid; place-items: center; width: 32px; height: 32px; padding: 0; border: 1px solid var(--border); background: var(--card); color: var(--fg); border-radius: 8px; cursor: pointer; }
.icon-btn:hover { background: var(--accent); }
.icon-btn:disabled { opacity: .6; cursor: progress; }
.icon-btn.spin svg { animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.spinner { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--border); border-top-color: var(--fg); display: inline-block; vertical-align: -1px; animation: spin .8s linear infinite; }

/* header and banner */
.head { display: flex; flex-direction: column; gap: 10px; }
.banner { position: relative; overflow: hidden; display: flex; flex-direction: column; padding: 16px 18px 18px; border-radius: 12px; color: #fff;
  background: radial-gradient(120% 140% at 85% 20%, rgba(167, 139, 250, .55) 0%, rgba(167, 139, 250, 0) 55%), linear-gradient(120deg, #0b1020 0%, #1e1b4b 45%, #4338ca 100%);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .10); }
.banner-art { position: absolute; top: 50%; right: -22px; transform: translateY(-50%); height: 66%; width: auto; max-width: 100%; pointer-events: none; }
@media (max-width: 380px) { .banner-art { opacity: .3; } }
.banner > :not(.banner-art) { position: relative; }
.banner h1 { font-size: 18px; letter-spacing: -.01em; color: #fff; }
.banner .updated { color: rgba(255, 255, 255, .72); }
.bn-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.bn-top .title-block { flex-direction: column; align-items: flex-start; gap: 2px; margin-right: 0; }
.bn-kicker { margin-top: 14px; font-size: 12px; color: rgba(255, 255, 255, .72); }
.bn-amt { margin-top: 2px; font-size: 34px; font-weight: 700; line-height: 1.1; color: #fff; font-variant-numeric: tabular-nums; }
.banner.danger .bn-amt { text-shadow: 0 0 18px rgba(248, 113, 113, .7); }
.bn-skel { display: block; width: 170px; max-width: 70%; height: 36px; margin-top: 4px; border-radius: 8px; background: linear-gradient(90deg, rgba(255, 255, 255, .10) 0%, rgba(255, 255, 255, .26) 50%, rgba(255, 255, 255, .10) 100%); background-size: 200% 100%; animation: shimmer 1.4s ease-in-out infinite; }
.bn-sub { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin-top: 6px; font-size: 12px; color: rgba(255, 255, 255, .85); font-variant-numeric: tabular-nums; }
.pill { display: inline-flex; align-items: center; min-height: 22px; padding: 1px 10px; border-radius: 999px; background: rgba(255, 255, 255, .14); border: 1px solid rgba(255, 255, 255, .28); color: #fff; font-weight: 600; cursor: help; }
.banner.warn .pill { background: rgba(251, 191, 36, .30); border-color: rgba(251, 191, 36, .65); }
.banner.danger .pill { background: rgba(248, 113, 113, .34); border-color: rgba(248, 113, 113, .75); }
.title-block { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-right: auto; }
.updated { font-size: 12px; color: var(--muted-fg); }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tabrow { display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--border); margin: 10px 0 2px; }
.tabrow .tabs { flex: 1; min-width: 0; margin: 0 0 -1px; }
.tab-refresh { flex: none; width: 30px; height: 30px; border-color: transparent; background: transparent; color: var(--muted-fg); }
.tab-refresh:hover { color: var(--fg); background: var(--accent); }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; position: relative; }
.tabs button { border: 0; background: transparent; color: var(--muted-fg); padding: 8px 12px; min-height: 36px; cursor: pointer; border-bottom: 2px solid transparent; font: inherit; white-space: nowrap; transition: color .15s ease, border-color .15s ease; }
.tabs button:hover { color: var(--fg); }
.tabs button[aria-selected="true"] { color: var(--fg); font-weight: 600; border-bottom-color: var(--s1, #3b82f6); }
.tabs button:focus-visible { outline: 2px solid var(--s1, #3b82f6); outline-offset: -2px; border-radius: 4px; }
@media (max-width: 360px) { .tabs button { padding: 8px 8px; } }
.tabbody { display: grid; gap: 12px; }
.keylist { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.kr { padding: 10px 0; border-top: 1px solid var(--border); display: grid; gap: 6px; }
.kr:first-child { border-top: 0; padding-top: 2px; }
.kr-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.kr-name { display: inline-flex; align-items: center; gap: 8px; min-width: 0; flex-wrap: wrap; }
.kr-val { font-weight: 600; font-variant-numeric: tabular-nums; }
.kr-meta { color: var(--muted-fg); font-size: 12px; line-height: 1.5; }
.lg-sum { margin: 0 0 8px; }
.ledger { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.lg-row { display: grid; grid-template-columns: 96px 1fr auto; gap: 10px; align-items: center; padding: 4px 0; }
.lg-date { white-space: nowrap; color: var(--muted-fg); font-variant-numeric: tabular-nums; }
.lg-date em { font-style: normal; font-size: 11px; opacity: .8; }
.lg-bar { height: 8px; border-radius: 4px; background: color-mix(in srgb, var(--accent) 55%, transparent); overflow: hidden; }
.lg-bar i { display: block; height: 100%; border-radius: 4px; background: var(--s1, #3b82f6); }
.lg-row.partial .lg-bar i { opacity: .55; }
.lg-val { font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; padding: 2px; background: var(--card); gap: 2px; }
.seg button { border: 0; background: transparent; color: var(--muted-fg); min-height: 26px; padding: 3px 10px; border-radius: 6px; cursor: pointer; transition: background-color .15s ease, color .15s ease; }
.seg button:hover { color: var(--fg); background: color-mix(in srgb, var(--accent) 55%, transparent); }
.seg button[aria-checked="true"] { background: var(--accent); color: var(--fg); font-weight: 600; box-shadow: inset 0 0 0 1px var(--border); }

/* notices and states */
.notice, .status { padding: 10px 12px; border-radius: var(--radius); border: 1px dashed var(--border); color: var(--muted-fg); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: space-between; }
.notice { border-style: solid; border-color: color-mix(in srgb, var(--s4) 60%, var(--border)); background: color-mix(in srgb, var(--s4) 10%, var(--card)); color: var(--fg); }
.status.error { border-style: solid; border-color: var(--destructive); color: var(--fg); }
.status.error button { margin-left: auto; }
.err-line { display: block; max-width: 100%; padding: 8px 10px; border: 1px solid var(--destructive); border-radius: 8px; background: color-mix(in srgb, var(--destructive) 12%, var(--card)); color: var(--fg); font-size: 12px; line-height: 1.4; overflow-wrap: anywhere; }
.err-card { border-color: var(--destructive); }
.err-card h2 { font-size: 14px; }
.skeleton { display: flex; flex-direction: column; gap: 16px; }
.skel { border-radius: var(--radius); border: 1px solid var(--border); background: linear-gradient(90deg, var(--card) 0%, var(--accent) 50%, var(--card) 100%); background-size: 200% 100%; animation: shimmer 1.4s ease-in-out infinite; }
.sk-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
.sk-tiles .skel { height: 88px; }
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

/* forms, setup and settings */
.setup { gap: 14px; }
.setup p { line-height: 1.5; }
.keyform { display: flex; flex-direction: column; gap: 10px; }
.row-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.hr { border: 0; border-top: 1px solid var(--border); margin: 0; }
.field { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--muted-fg); }
.field em { font-style: normal; opacity: .8; }
.field input { font: inherit; font-size: 13px; color: var(--fg); background: var(--bg); border: 1px solid var(--orca-input, var(--border)); border-radius: 8px; padding: 8px 10px; min-height: 36px; width: 100%; }
.field input:focus-visible { outline: 2px solid var(--s1); outline-offset: 0; }
.field select { font: inherit; font-size: 13px; color: var(--fg); background: var(--bg); border: 1px solid var(--orca-input, var(--border)); border-radius: 8px; padding: 8px 10px; min-height: 36px; width: 100%; }
.field select:disabled { opacity: .6; }
.opt-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.toggles { display: flex; flex-direction: column; gap: 2px; }
.toggle { display: inline-flex; gap: 8px; align-items: center; min-height: 28px; cursor: pointer; }
.toggle input { accent-color: var(--s1); width: 15px; height: 15px; margin: 0; flex: none; cursor: pointer; }
.err { color: var(--destructive); font-size: 12px; }
.err:empty { display: none; }
.foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; padding: 2px 2px 8px; }
.confirm { display: inline-flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.danger-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }

/* tiles */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
.tile { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; min-height: 88px; }
.tile-cache { cursor: help; }
.tile .label { color: var(--muted-fg); font-size: 12px; }
.tile .value { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .sub { color: var(--muted-fg); font-size: 11px; }

/* cards */
.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; max-width: 100%; }
.card-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 16px; }
.grid-2 > * { min-width: 0; }
.legend { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; }
.legend li { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.legend .v { color: var(--muted-fg); font-variant-numeric: tabular-nums; }

/* charts */
svg.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { font: 10px system-ui, sans-serif; fill: var(--muted-fg); }
.chart .grid { stroke: var(--border); stroke-opacity: .7; stroke-width: 1; stroke-dasharray: 2 4; }
.chart .col { outline: none; }
.chart .col rect.hit { fill: transparent; }
.chart .col:hover rect.hit, .chart .col:focus-visible rect.hit { fill: var(--accent); fill-opacity: .6; }
.chart .col:focus-visible rect.hit { stroke: var(--s1); stroke-width: 1; }
.chart .col:hover .seg-rect { filter: brightness(1.15); }
.chart .partial-outline { fill: none; stroke: var(--fg); stroke-opacity: .55; stroke-width: 1; stroke-dasharray: 3 2; }
.chart .line { fill: none; stroke: var(--s1); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .area { fill: var(--s1); opacity: .12; }
.chart .dot { fill: var(--s1); stroke: var(--card); stroke-width: 1.5; cursor: default; outline: none; }
.chart .dot:focus-visible { stroke: var(--s1); stroke-width: 2; }
.chart .t-strong { font-size: 14px; font-weight: 600; fill: var(--fg); }
.heat { cursor: default; }
.heat-wrap { overflow-x: auto; }
.cell { rx: 2; }
.cell:hover { stroke: var(--fg); stroke-width: 1; }
.cell.q0 { fill: var(--muted); }
.cell.q1 { fill: var(--q1); }
.cell.q2 { fill: var(--q2); }
.cell.q3 { fill: var(--q3); }
.cell.q4 { fill: var(--q4); }
.scale { display: flex; gap: 3px; align-items: center; font-size: 11px; justify-content: flex-end; }
.scale i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.scale .muted:first-child { margin-right: 3px; }
.scale .muted:last-child { margin-left: 3px; }
.scale .q0 { background: var(--muted); }
.scale .q1 { background: var(--q1); }
.scale .q2 { background: var(--q2); }
.scale .q3 { background: var(--q3); }
.scale .q4 { background: var(--q4); }
.mix { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; justify-content: center; flex: 1; }
svg.chart.donut { width: 96px; height: 96px; flex: none; }
.donut text { font: 9px system-ui, sans-serif; fill: var(--muted-fg); }
.mix-legend { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; font-size: 12px; min-width: 150px; }
.mix-legend li { display: grid; grid-template-columns: auto 1fr auto; gap: 6px; align-items: center; }
.mix-legend .v { font-variant-numeric: tabular-nums; color: var(--muted-fg); text-align: right; }

/* ranked lists */
.rank { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.rk-top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; min-width: 0; }
.rk-name { display: flex; gap: 7px; align-items: center; min-width: 0; overflow-wrap: anywhere; font-weight: 500; }
.rk-val { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.rk-bar { display: block; width: 100%; height: 8px; margin: 6px 0 4px; background: var(--muted); border-radius: 999px; overflow: hidden; }
.rk-bar i { display: block; height: 100%; border-radius: inherit; min-width: 2px; }
.rk-meta { font-size: 12px; color: var(--muted-fg); font-variant-numeric: tabular-nums; }

/* tables */
.table-wrap { overflow-x: auto; width: 100%; min-width: 0; max-width: 100%; }
.kname { font-weight: 500; overflow-wrap: anywhere; }
.khash { display: block; font-size: 11px; color: var(--muted-fg); font-weight: 400; }
.off { display: inline-block; font-size: 11px; border: 1px solid var(--border); border-radius: 999px; padding: 0 7px; color: var(--muted-fg); margin-left: 6px; vertical-align: 1px; font-weight: 400; }
.lim { display: flex; flex-direction: column; gap: 4px; font-size: 12px; }
.meter-sm { height: 6px; border-radius: 999px; background: var(--muted); overflow: hidden; }
.meter-sm i { display: block; height: 100%; background: var(--s1); border-radius: inherit; }

/* daily chart */
.chart .ylab { opacity: .85; }
.dchart .col { transition: opacity .15s ease; }
.dchart:has(.col:hover) .col:not(:hover), .dchart:has(.col:focus-visible) .col:not(:focus-visible) { opacity: .4; }
.chart .avg { fill: none; stroke: var(--fg); stroke-opacity: .6; stroke-width: 1; stroke-dasharray: 4 3; }
.chart .avg-lab { font-weight: 600; fill: var(--fg); stroke: var(--card); stroke-width: 3px; paint-order: stroke; stroke-linejoin: round; }

/* share bars */
.sharebar { display: flex; gap: 3px; height: 12px; border-radius: 999px; overflow: hidden; background: var(--muted); }
.sharebar.slim { height: 8px; }
.sharebar > i { display: block; min-width: 3px; height: 100%; border-radius: 3px; }

/* models */
.mlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.mlist li + li { border-top: 1px solid var(--border); }
.mrow { display: flex; flex-direction: column; gap: 8px; width: 100%; margin: 0; padding: 10px 8px; border: 0; border-radius: 8px; background: transparent; color: inherit; text-align: left; cursor: pointer; }
.mrow:hover { background: var(--accent); }
.mr-top { display: flex; align-items: center; gap: 8px; min-width: 0; }
.mr-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.mr-val { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.mr-pct { min-width: 46px; text-align: right; font-size: 12px; color: var(--muted-fg); font-variant-numeric: tabular-nums; white-space: nowrap; }
.mr-chev { flex: none; color: var(--muted-fg); }
.mr-bar { display: block; height: 5px; border-radius: 999px; background: var(--muted); overflow: hidden; }
.mr-bar i { display: block; height: 100%; border-radius: inherit; min-width: 2px; }
.mlist-more { margin-top: 8px; align-self: flex-start; }

/* drawer */
.scrim { position: fixed; inset: 0; z-index: 60; background: rgba(0, 0, 0, .45); animation: fade-in .2s ease; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 61; max-height: 80vh; display: flex; flex-direction: column; background: var(--card); color: var(--fg); border: 1px solid var(--border); border-bottom: 0; border-radius: 16px 16px 0 0; box-shadow: 0 -12px 40px rgba(0, 0, 0, .3); animation: sheet-up .26s cubic-bezier(.2, .8, .2, 1); }
.sheet-grab { flex: none; width: 40px; height: 4px; margin: 8px auto 0; border-radius: 999px; background: var(--border); }
.sheet-body { overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column; gap: 14px; width: 100%; max-width: 720px; margin: 0 auto; padding: 12px 16px 20px; }
.dr-head { display: flex; align-items: flex-start; gap: 10px; min-width: 0; }
.dr-dot { width: 12px; height: 12px; margin-top: 6px; }
.dr-title { flex: 1; min-width: 0; }
.dr-title h2 { font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dr-title p { margin-top: 2px; overflow-wrap: anywhere; }
.dr-big { font-size: 28px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.dr-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.dr-grid .tile { min-height: 74px; }
.dr-grid .tile:last-child:nth-child(odd) { grid-column: 1 / -1; }
.dr-chart { gap: 8px; }
.spark-mm, .spark-x { display: flex; justify-content: space-between; gap: 8px; font-variant-numeric: tabular-nums; }
.spark-svg { width: 100%; height: auto; display: block; overflow: visible; }
.sp-area { opacity: .14; }
.sp-line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.sp-hit { fill: transparent; }
.sp:hover .sp-hit { fill: var(--accent); fill-opacity: .6; }
.sp-dot { opacity: 0; stroke: var(--card); stroke-width: 1.5; }
.sp:hover .sp-dot { opacity: 1; }
@keyframes fade-in { from { opacity: 0; } }
@keyframes sheet-up { from { transform: translateY(100%); } }

/* keys */
.kcards { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.kcard { display: flex; flex-direction: column; gap: 6px; min-width: 0; padding: 10px 12px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); }
.kcard.is-off, .kslim.is-off { opacity: .6; }
.kc-top { display: flex; align-items: center; gap: 10px; min-width: 0; }
.avatar { flex: none; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; color: #fff; font-weight: 600; font-size: 13px; }
.avatar.sm { width: 20px; height: 20px; font-size: 10px; }
.kc-id { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; }
.kc-name { min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kc-life { flex: none; text-align: right; }
.kc-val { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.kc-lab { font-size: 11px; color: var(--muted-fg); }
.st { flex: none; font-size: 11px; line-height: 18px; padding: 0 7px; border: 1px solid var(--border); border-radius: 999px; color: var(--muted-fg); white-space: nowrap; }
.st.ok { color: var(--s3); border-color: color-mix(in srgb, var(--s3) 50%, var(--border)); }
.kc-lim { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 10px; font-size: 12px; font-variant-numeric: tabular-nums; }
.kc-lim .kmeter { flex: 1 1 90px; min-width: 0; }
.kmeter { height: 6px; border-radius: 999px; background: var(--muted); overflow: hidden; }
.kmeter i { display: block; height: 100%; border-radius: inherit; background: var(--s1); }
.kmeter.warn i { background: var(--s4); }
.kmeter.danger i { background: var(--destructive); }
.kc-pct { white-space: nowrap; }
.kc-pct.warn { color: var(--s4); }
.kc-pct.danger { color: var(--destructive); }
.kc-foot { font-size: 11px; color: var(--muted-fg); overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.kslim { display: flex; align-items: center; gap: 8px; min-width: 0; padding: 6px 12px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); font-size: 12px; }
.kslim .kc-name { flex: 1; font-size: 13px; font-weight: 500; }
.kslim-meta { flex: none; color: var(--muted-fg); white-space: nowrap; }

/* tooltip */
.tip { position: fixed; z-index: 70; pointer-events: none; background: var(--orca-popover, var(--card)); color: var(--orca-popover-foreground, var(--fg)); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 6px 20px rgba(0,0,0,.25); max-width: 260px; line-height: 1.35; }
.tip[hidden] { display: none; }
.tip b { display: block; margin-bottom: 4px; }
.tip .row { display: flex; justify-content: space-between; gap: 12px; }
.tip .row span:last-child { font-variant-numeric: tabular-nums; }
.tip .sw { margin-right: 4px; vertical-align: -1px; }
.tip .note { margin-top: 6px; color: var(--muted-fg); font-size: 11px; }
.tip hr { border: 0; border-top: 1px solid var(--border); margin: 6px 0; }

@media (max-width: 480px) {
  main { padding: 12px; gap: 12px; }
  .stack { gap: 12px; }
  .grid-2 { gap: 12px; }
  .card { padding: 14px; }
  .banner { padding: 14px; }
  .bn-amt { font-size: 30px; }
  .tile .value { font-size: 16px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
  .icon-btn.spin svg { opacity: .6; }
}
</style>
</head>
<body>
<main id="app" aria-live="off"></main>
<div id="tip" class="tip" role="tooltip" hidden></div>
<script>
(() => {
'use strict';

const KEYS_URL = 'https://openrouter.ai/settings/management-keys';
const PREF_KEY = 'openrouter-usage:prefs';
const SEG_RANGE = [['7d', '7d'], ['30d', '30d'], ['all', 'All']];
const TABS = [['overview', 'Overview'], ['models', 'Models'], ['keys', 'Keys'], ['ledger', 'Ledger'], ['settings', 'Settings']];
const SEG_MEASURE = [['cost', 'Cost'], ['tokens', 'Tokens']];
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const TODAY_TIP = "Approximate: today's spend so far, computed from key totals rather than per-request activity.";
const SBC = [['credits', 'Credits left'], ['credits-today', "Credits left and today's spend"], ['credits-days', 'Credits left and days left']];
const ICON_REFRESH = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36L21 8"/><path d="M21 3v5h-5"/></svg>';

const state = {
  range: '30d',
  measure: 'cost',
  tab: 'overview',
  status: null,
  report: null,
  error: null,
  notice: '',
  loading: false,
  refreshing: false,
  settings: null,
  settingsErr: null,
  savedAt: 0,
  connBusy: false,
  connRes: null,           // { ok: true, label } | { ok: false, error }
  keyMsg: null,            // { ok, text }
  confirmDisc: false,
  drawer: null,            // model name open in the drawer, or null
  modelsAll: false,        // Models tab: show every row
  pendingDrawer: false     // #drawer: open the first model once the first report lands
};

let tips = [];
let reqSeq = 0;
let quietRun = false;          // the running refresh is automatic: no spinner, no dimmed content
let lastAutoAt = 0;
const AUTO_STALE_MS = 2 * 60e3; // refresh on start/focus when data is older than this
const AUTO_GAP_MS = 30e3;       // and never more than one automatic refresh per this window
const colorMap = new Map();

/* ---------- helpers ---------- */

const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const groupInt = (s) => String(s).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
const errMsg = (e) => (e && e.message) || String(e);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const round2 = (v) => Math.round(v * 100) / 100;
const round4 = (v) => Math.round(v * 10000) / 10000;

function money(v) {
  if (v == null || !isFinite(v)) return '—';
  const a = Math.abs(v);
  const sign = v < 0 ? '-' : '';
  if (a !== 0 && a < 0.01) return sign + '$' + a.toFixed(a < 0.001 ? 4 : 3);
  const [i, f] = a.toFixed(2).split('.');
  return sign + '$' + groupInt(i) + '.' + f;
}

function compact(n) {
  if (n == null || !isFinite(n)) return '—';
  const a = Math.abs(n);
  const sign = n < 0 ? '-' : '';
  const f = (x, u) => sign + (x >= 100 ? String(Math.round(x)) : x.toFixed(1).replace(/\.0$/, '')) + u;
  if (a >= 1e9) return f(a / 1e9, 'B');
  if (a >= 1e6) return f(a / 1e6, 'M');
  if (a >= 1e3) return f(a / 1e3, 'K');
  return sign + Math.round(a);
}

const pct = (v) => (v == null || !isFinite(v) ? '—' : (v * 100).toFixed(1) + '%');
const fmt = (v, meas) => (meas === 'tokens' ? compact(v) + ' tokens' : money(v));
const axisFmt = (v, meas) => (meas === 'tokens' ? compact(v) : v >= 10 ? '$' + groupInt(String(Math.round(v))) : money(v));
const fmtMeas = (v, meas) => (meas === 'tokens' ? compact(v) + ' tok' : money(v));
const shortModel = (name) => { const s = String(name == null ? '' : name); const i = s.lastIndexOf('/'); return i >= 0 && i < s.length - 1 ? s.slice(i + 1) : s; };
const legendName = (k) => (k === 'other' ? 'Other' : shortModel(k));

function dayLabel(d) {
  const [, m, dd] = d.split('-');
  return MONTHS[+m - 1] + ' ' + (+dd);
}
function dayLong(d) {
  return dayLabel(d) + ', ' + d.slice(0, 4);
}
const weekday = (d) => new Date(d + 'T00:00:00Z').getUTCDay();
const utcToday = () => new Date().toISOString().slice(0, 10);
function addDays(d, n) {
  const x = new Date(d + 'T00:00:00Z');
  x.setUTCDate(x.getUTCDate() + n);
  return x.toISOString().slice(0, 10);
}

function relTime(ts) {
  const t = typeof ts === 'string' ? Date.parse(ts) : ts;
  if (!isFinite(t)) return '—';
  const s = Math.max(0, (Date.now() - t) / 1000);
  if (s < 45) return 'just now';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  if (s < 2592000) return Math.floor(s / 86400) + 'd ago';
  return new Date(t).toISOString().slice(0, 10);
}
const absTime = (t) => new Date(t).toLocaleString();

// Local clock time of today's 00:00 UTC: when a "day" starts for this person.
const utcDayStartLocal = () => new Date(Date.parse(utcToday() + 'T00:00:00Z')).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
const utcFact = () => 'Days follow UTC. For you a new day starts at ' + utcDayStartLocal() + ' local time.';

function niceStep(v) {
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  const f = v / p;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p;
}

function colorOf(key) {
  if (key === 'other') return 'var(--m-other)';
  if (!colorMap.has(key)) colorMap.set(key, colorMap.size % 6);
  return 'var(--m' + colorMap.get(key) + ')';
}

function addTip(html) {
  tips.push(html);
  return tips.length - 1;
}

const chartW = () => Math.max(240, Math.min(window.innerWidth, 1100) - (window.innerWidth <= 480 ? 56 : 68));

function legendKeys(days) {
  const tot = {};
  days.forEach((d) => Object.keys(d.byModel).forEach((k) => { tot[k] = (tot[k] || 0) + d.byModel[k]; }));
  return Object.keys(tot).sort((a, b) => (a === 'other') - (b === 'other') || tot[b] - tot[a]);
}

/* ---------- prefs (per-viewer convenience only) ---------- */

function loadPrefs() {
  try {
    const raw = localStorage.getItem(PREF_KEY);
    if (!raw) return;
    const p = JSON.parse(raw);
    if (['7d', '30d', 'all'].includes(p.range)) state.range = p.range;
    if (['cost', 'tokens'].includes(p.measure)) state.measure = p.measure;
    if (TABS.some(([id]) => id === p.tab)) state.tab = p.tab;
  } catch (e) { /* storage unavailable: use defaults */ }
}

function savePrefs() {
  try {
    localStorage.setItem(PREF_KEY, JSON.stringify({ range: state.range, measure: state.measure, tab: state.tab }));
  } catch (e) { /* storage unavailable: ignore */ }
}

/* ---------- host bridge ---------- */

const host = () => window.orca;

async function req(name, input) {
  const r = await host().plugin.request(name, input === undefined ? {} : input);
  // Tolerate a bridge that wraps the handler result as { output }.
  if (r && typeof r === 'object' && !Array.isArray(r) && Object.keys(r).length === 1 && 'output' in r) return r.output;
  return r;
}

/* ---------- rendering: header and banner ---------- */

const lowOf = () => (state.settings && state.settings.lowBalanceUsd) || 0;

// Warning tone from the low-balance alert: danger at half the threshold, warning at the threshold.
function balanceTone(rep) {
  const low = lowOf();
  if (!rep || !(low > 0)) return '';
  const rem = rep.balance.remaining;
  return rem <= low / 2 ? 'danger' : rem <= low ? 'warn' : '';
}

function creditsHtml(rep) {
  if (!rep) {
    return `<div class="bn-kicker">Credits left</div><span class="bn-skel" aria-hidden="true"></span><span class="sr-only">Loading credits</span>`;
  }
  const b = rep.balance;
  let days = '<span>No recent spend to project runway</span>';
  if (b.daysLeft != null && b.burnPerDay != null) {
    const n = Math.round(b.daysLeft);
    const when = b.daysLeft < 1 ? 'less than 1 day' : `~${n} day${n === 1 ? '' : 's'}`;
    days = `<span>${esc(when)} left at ${esc(money(b.burnPerDay))}/day</span>`;
  }
  return `<div class="bn-kicker">Credits left</div>
    <div class="bn-amt">${esc(money(b.remaining))}</div>
    <div class="bn-sub">${days}<span class="pill" tabindex="0" title="${esc(TODAY_TIP + ' ' + utcFact())}">Today ≈ ${esc(money(rep.tiles.today))}</span></div>`;
}

function tabsHtml() {
  return `<div class="tabs" role="tablist" aria-label="Sections">${TABS.map(([id, label]) =>
    `<button type="button" role="tab" id="tab-${id}" aria-selected="${state.tab === id}" aria-controls="tabpanel" tabindex="${state.tab === id ? 0 : -1}" data-act="tab" data-val="${id}" data-fk="tab:${id}">${label}</button>`).join('')}</div>`;
}

function headHtml() {
  const st = state.status;
  const ready = !!(st && st.configured);
  const rep = state.report;
  const busy = !quietRun && (state.refreshing || !!(st && st.refreshing));
  const tone = ready ? balanceTone(rep) : '';
  const upd = rep
    ? `<span class="updated" data-rel="${rep.generatedAt}" data-prefix="Updated ">Updated ${relTime(rep.generatedAt)}</span>`
    : `<span class="updated">${state.loading ? 'Loading…' : !st ? 'Connecting…' : ready ? 'Waiting for data' : 'Not connected'}</span>`;
  const seg = (list, cur, group) => list.map(([v, l]) =>
    `<button type="button" role="radio" aria-checked="${cur === v}" tabindex="${cur === v ? 0 : -1}" data-act="${group}" data-val="${v}" data-fk="${group}:${v}">${l}</button>`).join('');
  let h = `<header class="head"><div class="banner${tone ? ' ' + tone : ''}"><svg class="banner-art" viewBox="220 0 186 100" preserveAspectRatio="xMaxYMid meet" aria-hidden="true" focusable="false">
      <defs><linearGradient id="bn-line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#c7d2fe" stop-opacity=".35"/></linearGradient></defs>
      <g fill="none" stroke="url(#bn-line)" stroke-width="1.6" stroke-linecap="round">
        <path d="M236 50 C 280 50, 292 14, 340 14"/><path d="M236 50 C 280 50, 292 38, 340 38"/>
        <path d="M236 50 C 280 50, 292 62, 340 62"/><path d="M236 50 C 280 50, 292 86, 340 86"/>
        <path d="M340 14 H 392 M340 38 H 392 M340 62 H 392 M340 86 H 392" stroke-opacity=".35" stroke-dasharray="2 6"/>
      </g>
      <g fill="#fff"><circle cx="236" cy="50" r="6" fill-opacity=".95"/><circle cx="236" cy="50" r="12" fill-opacity=".12"/>
        <circle cx="340" cy="14" r="4"/><circle cx="340" cy="38" r="4" fill-opacity=".8"/><circle cx="340" cy="62" r="4" fill-opacity=".9"/><circle cx="340" cy="86" r="4" fill-opacity=".7"/></g>
    </svg>
    <div class="bn-top"><div class="title-block"><h1>OpenRouter Usage</h1>${upd}</div></div>`;
  if (ready && (rep || !(st && st.lastError))) h += creditsHtml(rep);
  h += '</div>';
  if (ready) {
    const refresh = `<button type="button" class="icon-btn tab-refresh${busy ? ' spin' : ''}" data-act="refresh" data-fk="refresh" aria-label="Refresh now" title="Refresh"${busy ? ' disabled' : ''}>${ICON_REFRESH}</button>`;
    h += `<div class="tabrow">${tabsHtml()}${refresh}</div>`;
    const tab = state.tab;
    const range = tab === 'settings' ? '' : `<div class="seg" role="radiogroup" aria-label="Range">${seg(SEG_RANGE, state.range, 'range')}</div>`;
    const measure = tab === 'settings' || tab === 'keys' ? '' : `<div class="seg" role="radiogroup" aria-label="Measure">${seg(SEG_MEASURE, state.measure, 'measure')}</div>`;
    if (range || measure) h += `<div class="controls">${range}${measure}</div>`;
  }
  return h + '</header>';
}

/* ---------- rendering: content ---------- */

function skeletonHtml() {
  return `<div class="skeleton" role="status" aria-label="Loading usage">
    <div class="sk-tiles"><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
    <div class="skel" style="height:200px"></div>
    <div class="grid-2"><div class="skel" style="height:200px"></div><div class="skel" style="height:200px"></div></div>
  </div>`;
}

function noticeHtml() {
  return state.notice ? `<div class="notice" role="alert"><span>${esc(state.notice)}</span><button type="button" class="btn ghost" data-act="dismiss-notice" data-fk="dismiss-notice">Dismiss</button></div>` : '';
}

// The management-key form shared by the setup screen and Settings > Connection.
function keyFormHtml() {
  const m = state.keyMsg;
  return `<div class="keyform">
    <label class="field" for="mgmt"><span>Management key</span><input id="mgmt" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" data-fk="mgmt"></label>
    <div class="row-actions">
      <button type="button" class="btn primary" id="save-keys" data-act="save-keys" data-fk="save-keys">Verify &amp; save</button>
      <button type="button" class="link" data-act="open-keys" data-fk="open-keys">Create a management key</button>
    </div>
    <p id="key-msg" class="small${m ? (m.ok ? ' ok' : ' err-line') : ''}"${m && !m.ok ? ' role="alert"' : ' role="status"'}>${m ? esc(m.text) : ''}</p>
  </div>`;
}

function setupHtml() {
  return `<section class="card setup" aria-labelledby="h-setup">
    <h2 id="h-setup">Connect your OpenRouter account</h2>
    <p class="muted">A <strong>management key</strong> is required to read your credits, activity and keys.</p>
    <p class="muted small">Keys are verified once, then stored encrypted by Orca. This panel never keeps them.</p>
    ${keyFormHtml()}
  </section>`;
}

function tile(label, value, sub, tipText) {
  const tip = tipText ? ` tabindex="0" data-tip="${addTip(`<b>${esc(label)}</b><div class="note">${esc(tipText)}</div>`)}"` : '';
  return `<div class="tile${tipText ? ' tile-cache' : ''}"${tip}><span class="label">${esc(label)}</span><span class="value">${esc(value)}</span><span class="sub">${esc(sub)}</span></div>`;
}

function tilesHtml(rep) {
  const t = rep.tiles;
  const rl = { '7d': 'Last 7 days', '30d': 'Last 30 days', all: 'All time' }[rep.range] || '';
  return `<div class="tiles">${[
    tile('Spend', money(t.spend), rl),
    tile('Tokens in / out', compact(t.tokensIn) + ' / ' + compact(t.tokensOut), 'prompt / completion'),
    tile('Requests', groupInt(Math.round(t.requests)), rl),
    tile('Avg cost / request', t.avgCostPerRequest == null ? '—' : money(t.avgCostPerRequest), 'spend / requests'),
    tile('Cache hit rate', pct(t.cacheHitRate), 'of prompt tokens', 'Share of prompt tokens served from the provider cache.'),
    tile('Reasoning tokens', compact(t.reasoning), rl)
  ].join('')}</div>`;
}

function dayTip(d, meas) {
  const entries = Object.entries(d.byModel).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]);
  const rows = entries.map(([k, v]) => `<div class="row"><span><i class="sw" style="background:${colorOf(k)}"></i>${esc(k)}</span><span>${esc(fmt(v, meas))}</span></div>`).join('')
    || '<div class="row"><span>No activity</span><span>—</span></div>';
  return `<b>${esc(dayLong(d.date))}${d.partial ? ' · so far' : ''}</b>${rows}<hr><div class="row"><span>Total</span><span>${esc(fmt(d.total, meas))}</span></div>${d.partial ? '<div class="note">Partial: today so far, built from key totals rather than per-request activity. Updates on refresh.</div>' : ''}`;
}

function dailySvg(rep, W) {
  const days = rep.daily;
  const n = days.length;
  const meas = rep.measure;
  const H = 196, L = 52, R = 8, T = 14, B = 24;
  const iw = W - L - R, ih = H - T - B;
  // Round tick values (1, 2, 5 x 10^k) with about four gridlines.
  const dataMax = Math.max(0, ...days.map((d) => d.total));
  const tickStep = dataMax > 0 ? niceStep(dataMax / 4) : 0.25;
  const ticks = Math.max(2, Math.ceil(dataMax / tickStep - 1e-9));
  const max = tickStep * ticks;
  const band = iw / Math.max(1, n);
  const bw = Math.max(2, Math.min(22, band * 0.68));
  const step = Math.max(1, Math.ceil(n / 5));
  const keys = legendKeys(days);
  const bottom = T + ih;
  const Y = (v) => bottom - (v / max) * ih;
  let grid = '';
  for (let i = 0; i <= ticks; i++) {
    const v = tickStep * i;
    const y = Y(v).toFixed(1);
    grid += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y}" y2="${y}"/><text class="ylab" x="${L - 8}" y="${(+y + 3.5).toFixed(1)}" text-anchor="end">${esc(axisFmt(v, meas))}</text>`;
  }
  let bars = '', labels = '';
  days.forEach((d, i) => {
    const cx = L + band * i + band / 2;
    const x = cx - bw / 2;
    const top = Y(d.total);
    const r = Math.max(0, Math.min(4, bw / 2, bottom - top));
    // One outline for the whole stack, rounded only at the top; segments are clipped to it.
    const shape = `M${x.toFixed(1)} ${bottom} V${(top + r).toFixed(1)} Q${x.toFixed(1)} ${top.toFixed(1)} ${(x + r).toFixed(1)} ${top.toFixed(1)} H${(x + bw - r).toFixed(1)} Q${(x + bw).toFixed(1)} ${top.toFixed(1)} ${(x + bw).toFixed(1)} ${(top + r).toFixed(1)} V${bottom} Z`;
    const cid = 'dc' + i;
    const partialBar = d.partial && d.total > 0;
    let segs = '';
    let base = bottom;
    for (const k of keys) {
      const v = d.byModel[k] || 0;
      if (v <= 0) continue;
      const h = (v / max) * ih;
      base -= h;
      segs += `<rect class="seg-rect" x="${x.toFixed(1)}" y="${base.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0.5, h).toFixed(1)}" style="fill:${colorOf(k)}"${d.partial ? ' opacity=".5"' : ''}/>`;
    }
    if (partialBar) segs += `<rect x="${x.toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${(bottom - top).toFixed(1)}" fill="url(#hatch)"/>`;
    const label = dayLabel(d.date) + ': ' + fmt(d.total, meas) + (d.partial ? ' (so far)' : '');
    bars += `<g class="col" tabindex="0" role="img" aria-label="${esc(label)}" data-tip="${addTip(dayTip(d, meas))}"><rect class="hit" x="${(L + band * i).toFixed(1)}" y="${T}" width="${band.toFixed(1)}" height="${ih}"/><clipPath id="${cid}"><path d="${shape}"/></clipPath><g clip-path="url(#${cid})">${segs}</g>${partialBar ? `<path class="partial-outline" d="${shape}"/>` : ''}</g>`;
    if ((n - 1 - i) % step === 0) labels += `<text x="${cx.toFixed(1)}" y="${H - 6}" text-anchor="middle">${esc(dayLabel(d.date))}</text>`;
  });
  const done = days.filter((d) => !d.partial);
  let avgLine = '';
  if (done.length) {
    const avg = done.reduce((a, d) => a + d.total, 0) / done.length;
    const y = Y(avg).toFixed(1);
    avgLine = `<line class="avg" x1="${L}" x2="${W - R}" y1="${y}" y2="${y}"/><text class="avg-lab" x="${W - R}" y="${(+y - 5).toFixed(1)}" text-anchor="end">avg ${esc(fmtMeas(avg, meas))}</text>`;
  }
  return `<svg class="chart dchart" viewBox="0 0 ${W} ${H}" role="group" aria-label="Daily ${meas} for ${n} days">
    <defs><pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="none"/><line x1="0" y1="0" x2="0" y2="5" style="stroke:var(--card)" stroke-width="2"/></pattern></defs>
    ${grid}${bars}${avgLine}${labels}</svg>`;
}

function dailyCard(rep) {
  const items = legendKeys(rep.daily).map((k) => `<li title="${esc(k === 'other' ? 'Other' : k)}"><i class="sw" style="background:${colorOf(k)}" aria-hidden="true"></i><span>${esc(legendName(k))}</span></li>`).join('');
  return `<section class="card" aria-labelledby="h-daily">
    <div class="card-h"><h2 id="h-daily">Daily ${rep.measure === 'tokens' ? 'tokens' : 'spend'}</h2></div>
    ${items ? `<ul class="legend" aria-label="Models (top 5 plus other)">${items}</ul>` : ''}
    ${dailySvg(rep, chartW())}
  </section>`;
}

function intradayCard(rep) {
  const pts = rep.intraday;
  const W = chartW();
  const H = 120, L = 56, R = 10, T = 10, B = 22;
  const iw = W - L - R, ih = H - T - B;
  const t0 = pts[0].t, t1 = pts[pts.length - 1].t;
  let lo = Math.min(...pts.map((p) => p.remaining));
  let hi = Math.max(...pts.map((p) => p.remaining));
  const pad = (hi - lo) * 0.15 || Math.max(0.01, hi * 0.02);
  lo -= pad; hi += pad;
  const X = (t) => L + ((t - t0) / (t1 - t0 || 1)) * iw;
  const Y = (v) => T + (1 - (v - lo) / (hi - lo || 1)) * ih;
  const path = pts.map((p, i) => `${i ? 'L' : 'M'}${X(p.t).toFixed(1)} ${Y(p.remaining).toFixed(1)}`).join(' ');
  const area = `${path} L${X(t1).toFixed(1)} ${T + ih} L${X(t0).toFixed(1)} ${T + ih} Z`;
  const tm = (t) => new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  const dots = pts.map((p) => {
    const tip = addTip(`<b>${esc(tm(p.t))}</b><div class="row"><span>Credits left</span><span>${esc(money(p.remaining))}</span></div>`);
    return `<circle class="dot" cx="${X(p.t).toFixed(1)}" cy="${Y(p.remaining).toFixed(1)}" r="3.5" tabindex="0" data-tip="${tip}" aria-label="${esc(tm(p.t) + ': ' + money(p.remaining))}"/>`;
  }).join('');
  const last = pts[pts.length - 1];
  return `<section class="card" aria-labelledby="h-intra">
    <div class="card-h"><h2 id="h-intra">Credits today</h2><span class="muted small">Now ${esc(money(last.remaining))}</span></div>
    <svg class="chart" viewBox="0 0 ${W} ${H}" role="group" aria-label="Credits left through today, ${pts.length} points">
      <line class="grid" x1="${L}" x2="${W - R}" y1="${T}" y2="${T}"/>
      <line class="grid" x1="${L}" x2="${W - R}" y1="${T + ih}" y2="${T + ih}"/>
      <text x="${L - 6}" y="${T + 4}" text-anchor="end">${esc(money(hi - pad))}</text>
      <text x="${L - 6}" y="${T + ih}" text-anchor="end">${esc(money(lo + pad))}</text>
      <path class="area" d="${area}"/>
      <path class="line" d="${path}"/>
      ${dots}
      <text x="${L}" y="${H - 4}">${esc(tm(t0))}</text>
      <text x="${W - R}" y="${H - 4}" text-anchor="end">${esc(tm(t1))}</text>
    </svg>
  </section>`;
}

const MODELS_TOP = 8;
const CHEV = '<svg class="mr-chev" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>';
const modelVal = (it, meas) => (meas === 'tokens' ? it.prompt + it.completion : it.cost);

function modelsCard(rep) {
  const meas = rep.measure;
  const items = rep.models;
  const n = items.length;
  const total = items.reduce((a, it) => a + modelVal(it, meas), 0);
  const max = Math.max(1e-9, ...items.map((it) => modelVal(it, meas)));
  const top = items.slice(0, MODELS_TOP);
  const restV = total - top.reduce((a, it) => a + modelVal(it, meas), 0);
  let bar = top.map((it) => `<i style="flex-grow:${Math.max(0, modelVal(it, meas))};background:${colorOf(it.name)}"></i>`).join('');
  if (n > MODELS_TOP && restV > 0) bar += `<i style="flex-grow:${restV};background:var(--m-other)"></i>`;
  const shown = state.modelsAll ? items : top;
  const rows = shown.map((it) => {
    const v = modelVal(it, meas);
    const color = colorOf(it.name);
    const share = total > 0 ? pct(v / total) : '—';
    const label = `${it.name}: ${fmt(v, meas)}, ${share} of total`;
    return `<li><button type="button" class="mrow" data-act="model-open" data-val="${esc(it.name)}" data-fk="model:${esc(it.name)}" aria-haspopup="dialog" aria-label="${esc(label)}" title="${esc(it.name)}">
        <span class="mr-top"><i class="sw" style="background:${color}" aria-hidden="true"></i><span class="mr-name">${esc(shortModel(it.name))}</span><span class="mr-val">${esc(fmtMeas(v, meas))}</span><span class="mr-pct">${esc(share)}</span>${CHEV}</span>
        <span class="mr-bar" aria-hidden="true"><i style="width:${Math.max(0, (v / max) * 100).toFixed(1)}%;background:${color}"></i></span>
      </button></li>`;
  }).join('');
  const more = n > MODELS_TOP
    ? `<button type="button" class="btn ghost mlist-more" data-act="models-more" data-fk="models-more" aria-expanded="${state.modelsAll}">${state.modelsAll ? 'Show less' : 'Show ' + (n - MODELS_TOP) + ' more'}</button>`
    : '';
  return `<section class="card" aria-labelledby="h-models">
    <div class="card-h"><h2 id="h-models">Models</h2><span class="muted small">${esc(fmt(total, meas))} across ${n} model${n === 1 ? '' : 's'}</span></div>
    ${n ? `<div class="sharebar" role="img" aria-label="Share of ${esc(fmt(total, meas))} by model">${bar}</div><ul class="mlist">${rows}</ul>${more}` : '<p class="muted">No models in this range.</p>'}
  </section>`;
}

/* Newest-first list of days with spend, like a ledger: date, a bar, the amount. */
function ledgerCard(rep) {
  const meas = rep.measure;
  const days = rep.daily.filter((d) => d.total > 0).slice().reverse();
  if (!days.length) return '<section class="card" aria-labelledby="h-ledger"><div class="card-h"><h2 id="h-ledger">Daily ledger</h2></div><p class="muted">No days with activity in this range.</p></section>';
  const max = Math.max(...days.map((d) => d.total));
  const done = days.filter((d) => !d.partial);
  const sum = done.reduce((a, d) => a + d.total, 0);
  const avg = done.length ? sum / done.length : 0;
  const peak = done.reduce((a, d) => (a == null || d.total > a.total ? d : a), null);
  const summary = `<p class="muted small lg-sum">${done.length} active day${done.length === 1 ? '' : 's'} · avg ${esc(fmtMeas(avg, meas))}/day${peak ? ` · peak ${esc(dayLabel(peak.date))} (${esc(fmtMeas(peak.total, meas))})` : ''}</p>`;
  const rows = days.map((d) => `<li class="lg-row${d.partial ? ' partial' : ''}"><span class="lg-date">${esc(dayLabel(d.date))}${d.partial ? ' <em>so far</em>' : ''}</span><span class="lg-bar" aria-hidden="true"><i style="width:${Math.max(2, (d.total / max) * 100).toFixed(1)}%"></i></span><span class="lg-val">${esc(fmtMeas(d.total, meas))}</span></li>`).join('');
  return `<section class="card" aria-labelledby="h-ledger">
    <div class="card-h"><h2 id="h-ledger">Daily ledger</h2><span class="muted small">Newest first</span></div>
    ${summary}<ul class="ledger">${rows}</ul>
  </section>`;
}

const keyHue = (h) => (parseInt(String(h || '').slice(0, 6), 16) || 0) % 360;
const keyColor = (h) => 'hsl(' + keyHue(h) + ' 55% 46%)';
const keyName = (k) => k.name || k.label || String(k.hash || '').slice(0, 8) || 'Unnamed key';

const KEY_SPAN = { '7d': '7d', '30d': '30d', all: 'all time' };
const keyStatus = (k) => (k.disabled ? ['Disabled', 'off'] : k.lastUsedAt ? ['Active', 'ok'] : ['Never used', '']);
// No spend in the range and no limit: rendered as the single-line row, sorted after the rest.
const isSlimKey = (k) => k.spend === 0 && k.limit == null;
const spendOf = (k) => (k.spend == null ? -1 : k.spend);

function keyAvatar(k, name, small) {
  const initial = (Array.from(String(name).trim())[0] || '?').toUpperCase();
  return `<span class="avatar${small ? ' sm' : ''}" style="background:${keyColor(k.hash)}" aria-hidden="true">${esc(initial)}</span>`;
}

function keySlimHtml(k) {
  const name = keyName(k);
  const used = k.lastUsedAt ? 'used ' + relTime(k.lastUsedAt) : 'never used';
  return `<article class="kslim${k.disabled ? ' is-off' : ''}" aria-label="${esc(name)}">${keyAvatar(k, name, true)}<span class="kc-name" title="${esc(name)}">${esc(name)}</span><span class="kslim-meta">no spend · ${esc(used)}</span></article>`;
}

function keyCard(k, range) {
  const name = keyName(k);
  const [stLabel, stTone] = keyStatus(k);
  let limit = '';
  if (k.limit != null) {
    const lim = k.limit;
    const p = lim > 0 ? (k.usage / lim) * 100 : 100;
    const w = Math.min(100, Math.max(0, p));
    const tone = p >= 100 ? 'danger' : p > 80 ? 'warn' : '';
    const left = k.limitRemaining != null ? k.limitRemaining : Math.max(0, lim - k.usage);
    limit = `<div class="kc-lim"><div class="kmeter ${tone}" role="meter" aria-label="${esc(name)}: limit used" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(w)}"><i style="width:${w.toFixed(1)}%"></i></div><span class="kc-pct ${tone}">${p.toFixed(0)}% used · ${esc(money(left))} left</span></div>`;
  }
  const foot = [
    'today ' + money(k.usageDaily),
    'week ' + money(k.usageWeekly),
    'month ' + money(k.usageMonthly),
    k.lastUsedAt ? 'used ' + relTime(k.lastUsedAt) : 'never used',
    '…' + String(k.hash || '').slice(-6)
  ].join(' · ');
  return `<article class="kcard${k.disabled ? ' is-off' : ''}" aria-label="${esc(name)}">
      <div class="kc-top">${keyAvatar(k, name, false)}
        <div class="kc-id"><span class="kc-name" title="${esc(name)}">${esc(name)}</span><span class="st ${stTone}">${stLabel}</span></div>
        <div class="kc-life"><div class="kc-val"${k.spend == null ? ' title="Not fetched yet"' : ''}>${esc(money(k.spend))}</div><div class="kc-lab">${esc(KEY_SPAN[range] || '')}</div></div>
      </div>
      ${limit}
      <div class="kc-foot">${esc(foot)}</div>
    </article>`;
}

function keysCard(rep) {
  const range = rep.range;
  const ks = (rep.keys || []).slice().sort((a, b) =>
    ((isSlimKey(a) ? 1 : 0) - (isSlimKey(b) ? 1 : 0)) || (spendOf(b) - spendOf(a)) || (a.hash < b.hash ? -1 : a.hash > b.hash ? 1 : 0));
  const n = ks.length;
  const known = ks.filter((k) => k.spend != null);
  const total = known.reduce((a, k) => a + k.spend, 0);
  const spent = ks.filter((k) => k.spend > 0);
  const top = spent.slice(0, 5);
  const rest = total - top.reduce((a, k) => a + k.spend, 0);
  let bar = top.map((k) => `<i style="flex-grow:${k.spend};background:${keyColor(k.hash)}"></i>`).join('');
  if (spent.length > 5 && rest > 0) bar += `<i style="flex-grow:${rest};background:var(--m-other)"></i>`;
  const when = range === 'all' ? 'lifetime' : 'in ' + range;
  const sumTxt = known.length || !n ? money(total) : '—';
  const body = n
    ? `<ul class="kcards">${ks.map((k) => `<li data-key="${esc(k.hash)}">${isSlimKey(k) ? keySlimHtml(k) : keyCard(k, range)}</li>`).join('')}</ul>`
    : '<p class="muted">No API keys on this account.</p>';
  return `<section class="card" aria-labelledby="h-keys">
    <div class="card-h"><h2 id="h-keys">API keys</h2><span class="muted small">${n} key${n === 1 ? '' : 's'} · ${esc(sumTxt)} ${esc(when)}</span></div>
    ${total > 0 ? `<div class="sharebar slim" role="img" aria-label="Share of ${esc(money(total))} ${esc(when)} by key">${bar}</div>` : ''}
    ${body}
  </section>`;
}

function heatSvg(pts) {
  const cell = 11, gap = 3, stepN = cell + gap, LEFT = 28, TOP = 16;
  const off = weekday(pts[0].date);
  const cols = Math.ceil((off + pts.length) / 7);
  const vals = pts.map((p) => p.cost).filter((v) => v > 0).sort((a, b) => a - b);
  const q = (p) => (vals.length ? vals[Math.min(vals.length - 1, Math.floor(p * vals.length))] : 0);
  const t1 = q(0.25), t2 = q(0.5), t3 = q(0.75);
  const lvl = (v) => (v <= 0 ? 0 : v <= t1 ? 1 : v <= t2 ? 2 : v <= t3 ? 3 : 4);
  let s = '';
  [['Mon', 1], ['Wed', 3], ['Fri', 5]].forEach(([lab, row]) => {
    s += `<text x="0" y="${TOP + row * stepN + cell - 2}">${lab}</text>`;
  });
  let lastMonth = -1;
  pts.forEach((p, i) => {
    const idx = i + off;
    const c = Math.floor(idx / 7), r = idx % 7;
    const x = LEFT + c * stepN, y = TOP + r * stepN;
    const mon = +p.date.slice(5, 7) - 1;
    if (mon !== lastMonth && +p.date.slice(8, 10) <= 7) {
      s += `<text x="${x}" y="10">${MONTHS[mon]}</text>`;
      lastMonth = mon;
    }
    const tip = addTip(`<b>${esc(dayLong(p.date))}</b><div class="row"><span>Spend</span><span>${esc(money(p.cost))}</span></div>`);
    s += `<rect class="cell q${lvl(p.cost)}" x="${x}" y="${y}" width="${cell}" height="${cell}" rx="2" data-tip="${tip}"/>`;
  });
  const w = LEFT + cols * stepN, h = TOP + 7 * stepN;
  return `<svg class="chart heat" style="width:${w}px;height:${h}px" viewBox="0 0 ${w} ${h}" role="group" aria-label="Daily spend heatmap, ${pts.length} days">${s}</svg>`;
}

function heatCard(rep) {
  const pts = (rep.heatmap || []).slice(-182);
  const body = pts.length ? heatSvg(pts) : '<p class="muted">No history yet.</p>';
  return `<section class="card" aria-labelledby="h-heat">
    <div class="card-h"><h2 id="h-heat">Activity</h2>
      <div class="scale" aria-hidden="true"><span class="muted">Less</span><i class="q0"></i><i class="q1"></i><i class="q2"></i><i class="q3"></i><i class="q4"></i><span class="muted">More</span></div></div>
    <div class="heat-wrap">${body}</div>
  </section>`;
}

function mixCard(rep) {
  const m = rep.mix;
  const segs = [
    ['Cached prompt', m.cachedPrompt, 'var(--s3)'],
    ['Uncached prompt', m.uncachedPrompt, 'var(--s1)'],
    ['Completion', m.completion, 'var(--s2)'],
    ['Reasoning', m.reasoning, 'var(--s4)']
  ];
  const total = segs.reduce((a, s) => a + s[1], 0);
  const R = 38, C = 2 * Math.PI * R;
  let off = 0;
  let circles = `<circle cx="50" cy="50" r="${R}" fill="none" stroke="var(--muted)" stroke-width="12"/>`;
  if (total > 0) {
    segs.forEach(([, v, col]) => {
      const len = (C * v) / total;
      if (len > 0) circles += `<circle cx="50" cy="50" r="${R}" fill="none" stroke-width="12" style="stroke:${col}" stroke-dasharray="${len.toFixed(2)} ${(C - len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}"/>`;
      off += len;
    });
  }
  const legend = total > 0
    ? segs.map(([name, v, col]) => `<li><i class="sw" style="background:${col}"></i><span>${esc(name)}</span><span class="v">${esc(compact(v))} · ${pct(v / total)}</span></li>`).join('')
    : '<li class="muted">No tokens in this range.</li>';
  const summary = total > 0 ? 'Token mix: ' + segs.map(([n, v]) => `${n} ${pct(v / total)}`).join(', ') : 'No token activity';
  return `<section class="card" aria-labelledby="h-mix">
    <div class="card-h"><h2 id="h-mix">Token mix</h2><span class="muted small">${esc(compact(total))} tokens</span></div>
    <div class="mix">
      <svg class="chart donut" viewBox="0 0 100 100" role="img" aria-label="${esc(summary)}"><g transform="rotate(-90 50 50)">${circles}</g><text x="50" y="49" text-anchor="middle" class="t-strong">${esc(compact(total))}</text><text x="50" y="62" text-anchor="middle">tokens</text></svg>
      <ul class="mix-legend">${legend}</ul>
    </div>
  </section>`;
}

function reportHtml(rep) {
  const empty = rep.tiles.requests === 0 && rep.tiles.spend === 0 && rep.daily.every((d) => d.total === 0);
  const note = (t) => `<div class="status" role="status">${esc(t)}</div>`;
  let h = '';
  switch (state.tab) {
    case 'models':
      h = empty ? note('No models used in this range yet') : modelsCard(rep) + mixCard(rep);
      break;
    case 'keys':
      h = keysCard(rep);
      break;
    case 'ledger':
      h = (empty ? `<section class="card" aria-labelledby="h-ledger"><div class="card-h"><h2 id="h-ledger">Daily ledger</h2></div><p class="muted">No days with activity yet</p></section>` : ledgerCard(rep)) + heatCard(rep);
      break;
    default:
      h = tilesHtml(rep);
      if (empty) h += `<section class="card empty-card" aria-labelledby="h-empty"><h2 id="h-empty">No activity yet</h2><p class="muted">Make a request with any of your keys and it will show up here within a few minutes.</p></section>`;
      else {
        h += dailyCard(rep);
        if (rep.intraday && rep.intraday.length >= 2) h += intradayCard(rep);
      }
  }
  return `<div id="tabpanel" role="tabpanel" aria-labelledby="tab-${state.tab}" class="tabbody">${h}</div>`;
}

/* ---------- rendering: settings view ---------- */

function connResHtml() {
  const r = state.connRes;
  if (!r) return '';
  return r.ok
    ? `<span class="ok">Connected as ${esc(r.label)}</span>`
    : `<span class="err-line" role="alert">${esc(r.error)}</span>`;
}

function optionsHtml(s) {
  const chk = (v) => (v ? ' checked' : '');
  const recent = state.savedAt && Date.now() - state.savedAt < 1600;
  return `<div class="card-h"><h2 id="h-opts">Options</h2><span id="set-saved" class="ok small" role="status">${recent ? 'Saved' : ''}</span></div>
    <div class="opt-grid">
      <label class="field"><span>Refresh interval (minutes)</span><input type="number" inputmode="numeric" min="1" max="120" step="1" value="${esc(s.refreshMinutes)}" data-set="refreshMinutes" data-fk="set:refreshMinutes"></label>
      <label class="field"><span>Low balance alert (USD) <em>0 = off</em></span><input type="number" inputmode="decimal" min="0" step="any" value="${esc(s.lowBalanceUsd)}" data-set="lowBalanceUsd" data-fk="set:lowBalanceUsd"></label>
      <label class="field"><span>Daily budget (USD) <em>0 = off</em></span><input type="number" inputmode="decimal" min="0" step="any" value="${esc(s.dailyBudgetUsd)}" data-set="dailyBudgetUsd" data-fk="set:dailyBudgetUsd"></label>
    </div>
    <div class="toggles">
      <label class="toggle"><input type="checkbox" data-set="notifications" data-fk="set:notifications"${chk(s.notifications)}><span>Desktop notifications</span></label>
      <label class="toggle"><input type="checkbox" data-set="statusBar" data-fk="set:statusBar"${chk(s.statusBar)}><span>Show credits in the status bar</span></label>
      <label class="toggle"><input type="checkbox" data-set="includeByok" data-fk="set:includeByok"${chk(s.includeByok)}><span>Count BYOK usage in spend</span></label>
    </div>
    <label class="field"><span>Status bar shows</span><select data-set="statusBarContent" data-fk="set:statusBarContent"${s.statusBar ? '' : ' disabled'}>${SBC.map(([v, l]) => `<option value="${v}"${s.statusBarContent === v ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select></label>`;
}

function settingsHtml() {
  const st = state.status || {};
  const s = state.settings;
  const connLine = st.keyLabel ? `Connected as <strong>${esc(st.keyLabel)}</strong>` : 'Connected with a management key';
  const confirm = state.confirmDisc
    ? `<span class="confirm"><span>Remove stored keys from Orca?</span><button type="button" class="btn danger" data-act="disconnect-yes" data-fk="disconnect-yes">Disconnect</button><button type="button" class="btn ghost" data-act="disconnect-no" data-fk="disconnect-no">Cancel</button></span>`
    : '<button type="button" class="btn danger" data-act="disconnect-ask" data-fk="disconnect-ask">Disconnect</button>';
  const opts = s
    ? optionsHtml(s)
    : `<p class="${state.settingsErr ? 'err-line' : 'muted'}">${state.settingsErr ? 'Could not load settings: ' + esc(state.settingsErr) : 'Loading settings…'}</p>`;
  return `<section class="card" aria-labelledby="h-conn">
      <div class="card-h"><h2 id="h-conn">Connection</h2></div>
      <p>${connLine}</p>
      <div class="row-actions">
        <button type="button" class="btn" data-act="conn-test" data-fk="conn-test">${state.connBusy ? '<span class="spinner" aria-hidden="true"></span>Testing…' : 'Test connection'}</button>
        <span class="small" role="status" aria-live="polite">${connResHtml()}</span>
      </div>
      <hr class="hr">
      <h3>Replace management key</h3>
      ${keyFormHtml()}
      <hr class="hr">
      <div class="danger-row"><div><h3>Disconnect</h3><p class="muted small">Removes the stored management key from Orca.</p></div>${confirm}</div>
    </section>
    <section class="card" aria-labelledby="h-opts">${opts}</section>
    <section class="card" aria-labelledby="h-about">
      <h2 id="h-about">About the numbers</h2>
      <p class="muted small">Today is approximate (computed from key totals). Ranges longer than 30 days fill up from the day you installed.</p>
      <p class="muted small">Days (the Ledger, the daily chart and Today) follow UTC. For you a new day starts at ${esc(utcDayStartLocal())} local time.</p>
    </section>`;
}

/* ---------- rendering: footer and content ---------- */

// Plain-English error states. The worker's messages are shown as-is.
const mentionsKey = (t) => /key/i.test(String(t || ''));
const settingsBtn = () => '<button type="button" class="btn" data-act="go-settings" data-fk="go-settings">Replace the key in Settings</button>';
function errActionsHtml(text) {
  return `<div class="row-actions"><button type="button" class="btn primary" data-act="refresh" data-fk="try-again">Try again</button>${mentionsKey(text) ? settingsBtn() : ''}</div>`;
}
function errorCardHtml(text) {
  return `<section class="card err-card" role="alert" aria-labelledby="h-err">
    <h2 id="h-err">Couldn't load your usage</h2>
    <p class="err-line">${esc(text)}</p>
    <p class="muted small">It will keep retrying automatically.</p>
    ${errActionsHtml(text)}
  </section>`;
}
function staleHtml(s) {
  return `<div class="notice" role="status"><span>Offline/failing since ${esc(absTime(s.since))}, showing cached data: ${esc(s.error)}</span>${errActionsHtml(s.error)}</div>`;
}

function footerHtml(st) {
  const last = st.lastRefreshAt
    ? `<span class="muted" data-rel="${st.lastRefreshAt}" data-prefix="Last refresh ">Last refresh ${relTime(st.lastRefreshAt)}</span>`
    : '<span class="muted">Not refreshed yet</span>';
  return `<footer class="foot">${last}</footer>`;
}

function contentHtml() {
  const st = state.status;
  if (!st) return state.error ? `<div class="status error" role="alert"><span>Could not reach the plugin: ${esc(state.error)}</span><button type="button" class="btn" data-act="retry" data-fk="retry">Retry</button></div>` : skeletonHtml();
  if (!st.configured) return setupHtml();

  if (state.tab === 'settings') {
    return `<div class="stack">${noticeHtml()}${settingsHtml()}</div>`;
  }

  const rep = state.report;
  let h = noticeHtml();
  if (state.error) h += `<div class="status error" role="alert"><span>Could not load the report: ${esc(state.error)}</span><button type="button" class="btn" data-act="retry" data-fk="retry">Retry</button>${mentionsKey(state.error) ? settingsBtn() : ''}</div>`;
  if (rep && rep.stale) h += staleHtml(rep.stale);

  if (rep) h += reportHtml(rep);
  else if (!state.error) {
    if (st.lastError && !state.loading) h += errorCardHtml(st.lastError);
    else h += skeletonHtml() + (state.loading ? '' : '<div class="status" role="status">Waiting for the first scan to finish. This can take a few seconds.</div>');
  }
  h += footerHtml(st);
  return `<div class="stack${state.loading && rep ? ' busy' : ''}">${h}</div>`;
}

/* ---------- render (keeps focus via data-fk) ---------- */

function render() {
  const app = $('#app');
  const active = document.activeElement;
  const fk = (active && active.getAttribute && active.getAttribute('data-fk')) || '';
  // Background events (a worker refresh finishing) re-render everything. Keep what the person is
  // typing: password fields (the key being pasted) and the focused text/number field.
  const keep = {};
  app.querySelectorAll('input[type="password"], input[type="text"], input[type="number"]').forEach((el) => {
    const k = el.id || el.getAttribute('data-fk');
    if (k && (el.type === 'password' || el === active)) keep[k] = { v: el.value, a: el.selectionStart, b: el.selectionEnd };
  });
  tips = [];
  hideTip();
  app.innerHTML = headHtml() + contentHtml() + drawerHtml(state.report);
  Object.keys(keep).forEach((id) => {
    const el = document.getElementById(id) || [...app.querySelectorAll('input[data-fk]')].find((e) => e.getAttribute('data-fk') === id);
    if (el && el.value !== keep[id].v) {
      el.value = keep[id].v;
      try { if (keep[id].a != null) el.setSelectionRange(keep[id].a, keep[id].b); } catch (e) { /* not selectable */ }
    }
  });
  if (fk) {
    const el = [...app.querySelectorAll('[data-fk]')].find((e) => e.getAttribute('data-fk') === fk);
    if (el) el.focus({ preventScroll: true });
  }
  // Re-rendering resets the tab bar's sideways scroll; keep the selected tab visible on narrow panels.
  // Scroll only the tab bar itself (never the page, which would yank the view up on a background refresh).
  const tabsEl = app.querySelector('.tabs');
  const sel = tabsEl && tabsEl.querySelector('[aria-selected="true"]');
  if (sel) {
    const l = sel.offsetLeft, r = l + sel.offsetWidth;
    if (l < tabsEl.scrollLeft) tabsEl.scrollLeft = l;
    else if (r > tabsEl.scrollLeft + tabsEl.clientWidth) tabsEl.scrollLeft = r - tabsEl.clientWidth;
  }
}

/* ---------- tooltips ---------- */

function showTip(el) {
  const html = tips[+el.dataset.tip];
  if (html == null) return;
  const t = $('#tip');
  t.innerHTML = html;
  t.hidden = false;
  const r = el.getBoundingClientRect();
  const tw = t.offsetWidth, th = t.offsetHeight;
  let x = r.left + r.width / 2 - tw / 2;
  x = Math.max(8, Math.min(window.innerWidth - tw - 8, x));
  let y = r.top - th - 8;
  if (y < 8) y = r.bottom + 8;
  t.style.left = x + 'px';
  t.style.top = y + 'px';
}

function hideTip() {
  const t = $('#tip');
  if (t) t.hidden = true;
}

/* ---------- state transitions ---------- */

async function refreshStatus() {
  try {
    state.status = await req('status.get');
    state.error = null;
  } catch (e) {
    state.error = errMsg(e);
  }
  if (state.status && state.status.configured) {
    if (!state.report) loadReport();
    else render();
  } else {
    state.report = null;
    render();
  }
}

async function loadReport(quiet) {
  if (!state.status || !state.status.configured) { render(); return; }
  const my = ++reqSeq;
  if (!quiet) { state.loading = true; render(); }
  let rep = null, err = null;
  try {
    rep = await req('report.get', { range: state.range, measure: state.measure });
  } catch (e) {
    err = errMsg(e);
  }
  if (my !== reqSeq) return;
  state.loading = false;
  state.error = err;
  if (!err) state.report = rep || null;
  let opened = false;
  if (state.pendingDrawer && state.report && state.report.models.length) {
    state.pendingDrawer = false;
    state.drawer = state.report.models[0].name;
    opened = true;
  }
  if (state.drawer && !(state.report && state.report.models.some((m) => m.name === state.drawer))) state.drawer = null;
  render();
  if (opened) focusFk('drawer-close');
}

// quiet: an automatic refresh. It shows no spinner and no dimming, and reports failures through the status line.
async function doRefresh(quiet) {
  if (state.refreshing) return;
  state.refreshing = true;
  quietRun = !!quiet;
  if (!quiet) { state.notice = ''; render(); }
  let res;
  try {
    res = await req('refresh');
  } catch (e) {
    res = { ok: false, error: errMsg(e) };
  }
  state.refreshing = false;
  quietRun = false;
  if (!quiet && (!res || res.ok === false)) state.notice = 'Refresh failed: ' + ((res && res.error) || 'unknown error');
  try {
    state.status = await req('status.get');
  } catch (e) { /* keep the last status */ }
  render();
  if (quiet || !state.notice) loadReport(quiet);
}

// Starts a quiet refresh when the cached data is older than two minutes (or unknown), at most once per 30 seconds.
function maybeAutoRefresh() {
  const st = state.status;
  if (!st || !st.configured || st.refreshing || state.refreshing) return;
  const now = Date.now();
  if (st.lastRefreshAt != null && now - st.lastRefreshAt < AUTO_STALE_MS) return;
  if (now - lastAutoAt < AUTO_GAP_MS) return;
  lastAutoAt = now;
  doRefresh(true);
}

// Writes the key-form message in place so a typed key is not lost to a re-render.
function setKeyMsg(ok, text) {
  state.keyMsg = { ok, text };
  const el = $('#key-msg');
  if (el) {
    el.className = 'small ' + (ok ? 'ok' : 'err-line');
    el.textContent = text;
  }
}

async function saveKeys() {
  const mEl = $('#mgmt'), btn = $('#save-keys');
  if (!mEl || !btn || btn.disabled) return;
  const m = mEl.value.trim();
  if (!m) {
    setKeyMsg(false, 'Enter your management key first.');
    mEl.focus();
    return;
  }
  btn.disabled = true;
  btn.textContent = 'Verifying…';
  setKeyMsg(true, '');
  state.keyMsg = null;
  let res;
  try {
    res = await req('keys.save', { mgmtKey: m });
  } catch (e) {
    res = { ok: false, error: errMsg(e) };
  }
  if (res && res.ok) {
    mEl.value = '';
    state.keyMsg = { ok: true, text: 'Key verified and saved' };
    await refreshStatus();
  } else {
    btn.disabled = false;
    btn.textContent = 'Verify & save';
    setKeyMsg(false, (res && res.error) || 'Could not verify the key.');
  }
}

async function testConnection() {
  if (state.connBusy) return;
  state.connBusy = true;
  state.connRes = null;
  render();
  let res;
  try {
    res = await req('connection.test');
  } catch (e) {
    res = { ok: false, error: errMsg(e) };
  }
  state.connBusy = false;
  state.connRes = res && res.ok
    ? { ok: true, label: res.label }
    : { ok: false, error: (res && res.error) || 'Connection test failed.' };
  render();
}

async function disconnect() {
  state.confirmDisc = false;
  try {
    await req('keys.clear');
  } catch (e) {
    state.notice = 'Could not disconnect: ' + errMsg(e);
  }
  await refreshStatus();
}

async function loadSettings() {
  try {
    state.settings = await req('settings.get');
    state.settingsErr = null;
  } catch (e) {
    state.settingsErr = errMsg(e);
  }
  render();
}

function saveSetting(field, value) {
  req('settings.set', { [field]: value }).then((s) => {
    state.settings = s;
    state.settingsErr = null;
    state.savedAt = Date.now();
    render();
    const at = state.savedAt;
    setTimeout(() => {
      if (state.savedAt !== at) return;
      const m = $('#set-saved');
      if (m) m.textContent = '';
    }, 1500);
    if (field === 'includeByok') loadReport();
  }).catch((e) => {
    state.notice = 'Could not save setting: ' + errMsg(e);
    render();
  });
}

// Tab switch. Entering Settings reloads settings.get, as opening the old settings view did.
function selectTab(id) {
  state.tab = id;
  state.drawer = null;
  if (id === 'settings') {
    state.keyMsg = null;
    state.connRes = null;
    state.confirmDisc = false;
  }
  savePrefs();
  render();
  window.scrollTo(0, 0);
  if (id === 'settings') loadSettings();
}

/* ---------- model drawer ---------- */

const CLOSE_SVG = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>';

function focusFk(fk) {
  const el = [...$('#app').querySelectorAll('[data-fk]')].find((e) => e.getAttribute('data-fk') === fk);
  if (!el) return false;
  el.focus({ preventScroll: true });
  return true;
}

function openDrawer(name) {
  state.drawer = name;
  render();
  focusFk('drawer-close');
}

function closeDrawer() {
  if (!state.drawer) return;
  const fk = 'model:' + state.drawer;
  state.drawer = null;
  render();
  focusFk(fk);
}

function trapTab(e) {
  const sheet = $('.sheet');
  if (!sheet) return;
  const f = [...sheet.querySelectorAll('button, [href], input, [tabindex]:not([tabindex="-1"])')];
  if (!f.length) return;
  const first = f[0], last = f[f.length - 1];
  const cur = document.activeElement;
  if (e.shiftKey && (cur === first || !sheet.contains(cur))) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && (cur === last || !sheet.contains(cur))) { e.preventDefault(); first.focus(); }
}

function sparkHtml(rep, m) {
  const meas = rep.measure;
  const series = m.series || [];
  const n = series.length;
  const dates = rep.daily.filter((d) => !d.partial).map((d) => d.date);
  if (!n) return '<p class="muted small">No completed days in this range.</p>';
  const col = colorOf(m.name);
  const W = 300, H = 96, P = 6;
  const hi = Math.max(0, ...series) || 1;
  const lo = Math.min(...series);
  const X = (i) => (n === 1 ? W / 2 : P + (i * (W - 2 * P)) / (n - 1));
  const Y = (v) => H - P - (Math.max(0, v) / hi) * (H - 2 * P);
  const slot = n === 1 ? W : (W - 2 * P) / (n - 1);
  const line = series.map((v, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)} ${Y(v).toFixed(1)}`).join(' ');
  const area = `${line} L${X(n - 1).toFixed(1)} ${H - P} L${X(0).toFixed(1)} ${H - P} Z`;
  const hits = series.map((v, i) => {
    const d = dates[i];
    const tip = addTip(`<b>${esc(d ? dayLong(d) : 'Day ' + (i + 1))}</b><div class="row"><span>${esc(shortModel(m.name))}</span><span>${esc(fmt(v, meas))}</span></div>`);
    return `<g class="sp" data-tip="${tip}"><rect class="sp-hit" x="${(X(i) - slot / 2).toFixed(1)}" y="0" width="${slot.toFixed(1)}" height="${H}"/><circle class="sp-dot" cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="3.5" style="fill:${col}"/></g>`;
  }).join('');
  return `<div class="spark">
    <div class="spark-mm muted small"><span>Low ${esc(fmt(lo, meas))}</span><span>High ${esc(fmt(hi, meas))}</span></div>
    <svg class="spark-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(shortModel(m.name))} daily ${meas}, ${n} days">
      <path class="sp-area" d="${area}" style="fill:${col}"/>
      <path class="sp-line" d="${line}" style="stroke:${col}"/>
      ${hits}
    </svg>
    <div class="spark-x muted small"><span>${esc(dates[0] ? dayLabel(dates[0]) : '')}</span><span>${esc(dates[n - 1] ? dayLabel(dates[n - 1]) : '')}</span></div>
  </div>`;
}

function drawerHtml(rep) {
  if (!state.drawer || !rep || state.tab !== 'models') return '';
  const m = rep.models.find((x) => x.name === state.drawer);
  if (!m) return '';
  const meas = rep.measure;
  const total = rep.models.reduce((a, it) => a + modelVal(it, meas), 0);
  const v = modelVal(m, meas);
  const hit = m.prompt > 0 ? m.cached / m.prompt : null;
  const avg = m.requests > 0 ? m.cost / m.requests : null;
  const tiles = [
    tile('Requests', groupInt(Math.round(m.requests)), ''),
    tile('Avg cost / request', avg == null ? '—' : money(avg), 'spend / requests'),
    tile('Input tokens', compact(m.prompt), 'prompt'),
    tile('Output tokens', compact(m.completion), 'completion'),
    tile('Reasoning tokens', compact(m.reasoning), ''),
    tile('Cached prompt', compact(m.cached), hit == null ? '' : pct(hit) + ' cache hit'),
    tile('Cost per 1M tokens', m.costPerMTok == null ? '—' : money(m.costPerMTok), 'prompt + completion')
  ].join('');
  const dl = meas === 'tokens' ? 'tokens' : 'spend';
  return `<div class="scrim" data-act="drawer-close" aria-hidden="true"></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="dr-title" aria-describedby="dr-sub">
    <div class="sheet-grab" aria-hidden="true"></div>
    <div class="sheet-body">
      <div class="dr-head">
        <i class="sw dr-dot" style="background:${colorOf(m.name)}" aria-hidden="true"></i>
        <div class="dr-title"><h2 id="dr-title" title="${esc(m.name)}">${esc(shortModel(m.name))}</h2><p class="muted small" id="dr-sub">${esc(m.name)}</p></div>
        <button type="button" class="icon-btn" data-act="drawer-close" data-fk="drawer-close" aria-label="Close">${CLOSE_SVG}</button>
      </div>
      <div><div class="dr-big">${esc(fmt(v, meas))}</div><p class="muted small">${esc(total > 0 ? pct(v / total) : '—')} of total for this range</p></div>
      <div class="dr-grid">${tiles}</div>
      <section class="card dr-chart" aria-label="Daily ${dl} for ${esc(shortModel(m.name))}">
        <div class="card-h"><h3>Daily ${dl}</h3></div>
        ${sparkHtml(rep, m)}
      </section>
    </div>
