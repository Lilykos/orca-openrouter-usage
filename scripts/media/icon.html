<!doctype html>
<html><head><meta charset="utf-8"><title>icon</title>
<style>
  * { margin: 0; }
  html, body { width: 256px; height: 256px; overflow: hidden; background: transparent; }
  .icon { width: 256px; height: 256px; border-radius: 56px; position: relative; overflow: hidden;
    background: radial-gradient(90% 90% at 80% 15%, rgba(167,139,250,.65) 0%, rgba(167,139,250,0) 60%), linear-gradient(135deg, #1e1b4b 0%, #4338ca 100%); }
  svg { position: absolute; inset: 0; width: 100%; height: 100%; }
</style></head>
<body><div class="icon">
  <svg viewBox="0 0 256 256" aria-hidden="true">
    <g fill="none" stroke="#fff" stroke-opacity=".9" stroke-width="9" stroke-linecap="round">
      <path d="M64 128 C 120 128, 128 60, 192 60"/><path d="M64 128 C 120 128, 130 108, 192 108"/>
      <path d="M64 128 C 120 128, 130 148, 192 148"/><path d="M64 128 C 120 128, 128 196, 192 196"/>
    </g>
    <circle cx="64" cy="128" r="26" fill="#fff" fill-opacity=".14"/><circle cx="64" cy="128" r="17" fill="#fff"/>
    <g fill="#fff"><circle cx="192" cy="60" r="12"/><circle cx="192" cy="108" r="12" fill-opacity=".85"/><circle cx="192" cy="148" r="12" fill-opacity=".85"/><circle cx="192" cy="196" r="12" fill-opacity=".7"/></g>
  </svg>
</div></body></html>
