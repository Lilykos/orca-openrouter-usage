<!doctype html>
<html><head><meta charset="utf-8"><title>screenshot</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1600px; height: 1000px; overflow: hidden; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; color: #fff; }
  .stage { position: relative; width: 1600px; height: 1000px;
    background: radial-gradient(60% 80% at 80% 30%, rgba(129,140,248,.35) 0%, rgba(129,140,248,0) 62%), linear-gradient(125deg, #0b1020 0%, #17153f 55%, #2b2a86 100%); }
  .copy { position: absolute; left: 130px; top: 50%; transform: translateY(-50%); width: 640px; }
  .eyebrow { font-size: 24px; letter-spacing: .18em; text-transform: uppercase; color: rgba(255,255,255,.6); margin-bottom: 24px; }
  h1 { font-size: 76px; line-height: 1.04; letter-spacing: -.03em; font-weight: 700; }
  p { margin-top: 28px; font-size: 32px; line-height: 1.4; color: rgba(255,255,255,.8); }
  .frame { position: absolute; right: 170px; top: 65px; width: 560px; height: 870px; border-radius: 22px; overflow: hidden; background: #111;
    box-shadow: 0 0 0 1.5px rgba(255,255,255,.16), 0 40px 90px rgba(0,0,0,.55); }
  iframe { width: 100%; height: 100%; border: 0; display: block; }
</style></head>
<body><div class="stage">
  <div class="copy"><div class="eyebrow">OpenRouter Usage</div><h1 id="t"></h1><p id="c"></p></div>
  <div class="frame"><iframe id="f" title="panel"></iframe></div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById('t').textContent = q.get('t') || '';
  document.getElementById('c').textContent = q.get('c') || '';
  document.getElementById('f').src = '../../panel/index.html#' + (q.get('h') || 'dark');
</script></body></html>
